[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# As sugestões da IA rodam na plataforma da Mentorei (onde fica a chave do Claude): o Ao Vivo só repassa o pedido.
[[redirects]]
  from = "/api/aovivo-sugerir"
  to = "https://plataforma.mentorei.com.br/api/aovivo-sugerir"
  status = 200
  force = true

# O PowerPoint vira PDF na plataforma (pelo Google Drive da Mentorei): o Ao Vivo só repassa o pedido.
[[redirects]]
  from = "/api/converter-slides"
  to = "https://plataforma.mentorei.com.br/api/converter-slides"
  status = 200
  force = true

# O e-mail com os materiais da aula sai pela plataforma (Brevo da Mentorei): o Ao Vivo só repassa o pedido.
[[redirects]]
  from = "/api/aovivo-email"
  to = "https://plataforma.mentorei.com.br/api/aovivo-email"
  status = 200
  force = true
