<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roda do Comunicador Influente · Mentorei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #091216; --surface: #0F1D23; --surface-2: #142731; --line: rgba(230,236,234,.12);
  --text: #E9EFEC; --muted: #93A3A8; --lime: #C8F04A; --lime-soft: rgba(200,240,74,.14); --on-lime: #091216;
  --danger: #FF8A7A;
  --display: 'Manrope', 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #091216; --text: #E9EFEC; } }
:root[data-theme="dark"] { --bg: #091216; --text: #E9EFEC; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
       -webkit-font-smoothing: antialiased; min-height: 100vh; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; border-radius: 6px; }

.shell { max-width: 680px; margin: 0 auto; padding: 22px 20px 48px; }
.shell.wide { max-width: 1040px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
.top .logo { height: 22px; width: auto; display: block; }
.top .meta { color: var(--muted); font-size: 14px; }

h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; margin: 0; }
.muted { color: var(--muted); }
p { margin: 0; }

/* botões */
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 999px; padding: 15px 26px; font-weight: 600;
       font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
       transition: transform .12s ease, background .2s ease, opacity .2s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--lime); color: var(--on-lime); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn-link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: 15px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* abertura */
.intro { padding-top: 6vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 40px; align-items: center; }
.intro .wheel-hero { order: 2; width: 100%; max-width: 460px; justify-self: end; }
.intro .wheel-hero svg { width: 100%; height: auto; display: block; overflow: visible; }
.intro .wheel-hero .poly { transform-origin: 220px 210px; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .15s both; }
.intro .wheel-hero .dot { animation: pop .4s ease 1.1s both; }
@keyframes grow { from { transform: scale(.05); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 860px) { .intro { grid-template-columns: 1fr; gap: 8px; padding-top: 3vh; } .intro .wheel-hero { order: 0; max-width: 260px; justify-self: start; margin-left: -10px; } }
.intro h1 { font-size: clamp(38px, 6.4vw, 64px); line-height: 1.02; font-weight: 800; }
.intro .lead { font-size: 19px; color: var(--muted); margin-top: 18px; max-width: 34em; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 16px;
         overflow: hidden; margin: 32px 0 34px; }
.facts div { background: var(--surface); padding: 16px 18px; }
.facts b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--lime); }
.facts span { font-size: 14px; color: var(--muted); }

/* formulário */
.form-head { margin: 40px 0 26px; }
.form-head h2 { font-size: 32px; font-weight: 800; line-height: 1.1; }
.form-head p { color: var(--muted); margin-top: 10px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.field label small { color: var(--muted); font-weight: 400; }
.field input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
               font-size: 16px; transition: border-color .2s; }
.field input:focus { border-color: var(--lime); outline: none; }
.field .err { color: var(--danger); font-size: 14px; margin-top: 6px; display: none; }
.field.invalid input { border-color: var(--danger); }
.field.invalid .err { display: block; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); margin: 6px 0 26px; cursor: pointer; }
.consent input { width: 20px; height: 20px; accent-color: var(--lime); margin-top: 2px; flex-shrink: 0; }

/* pergunta */
.qtop { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin: 28px 0 30px; }
.qtop .mini { width: 92px; height: 92px; }
.qtop .count { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--muted); }
.qtop .count b { color: var(--text); font-size: 22px; }
.q h2 { font-size: clamp(30px, 6.5vw, 44px); font-weight: 800; line-height: 1.06; }
.q .desc { font-size: 18px; color: var(--muted); margin-top: 14px; max-width: 32em; }
.q .ask { margin-top: 34px; font-weight: 600; font-size: 16px; }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 14px; }
.scale button { aspect-ratio: 1 / 1.1; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
                font-family: var(--display); font-weight: 800; font-size: 20px; cursor: pointer;
                transition: background .15s, border-color .15s, color .15s, transform .12s; }
.scale button:hover { border-color: rgba(200,240,74,.6); }
.scale button[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); border-color: var(--lime); transform: translateY(-2px); }
.anchors { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--muted); margin-top: 10px; }
.qnav { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 18px; }
@media (pointer: coarse) { .hint { display: none; } }

/* resultado */
.res-head { margin: 34px 0 10px; }
.res-head .who { color: var(--muted); font-size: 15px; }
.res-head h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 800; line-height: 1.05; margin-top: 6px; }
.hero-res { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; align-items: center; margin-top: 18px; }
.radar-wrap { background: radial-gradient(circle at 50% 50%, rgba(200,240,74,.08), transparent 62%); border-radius: 24px; }
.radar-wrap svg { width: 100%; height: auto; display: block; }
.score-big { display: flex; align-items: baseline; gap: 10px; }
.score-big b { font-family: var(--display); font-size: 76px; font-weight: 800; line-height: 1; color: var(--lime); letter-spacing: -0.04em; }
.score-big span { color: var(--muted); font-size: 18px; }
.band { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px; background: var(--lime-soft); color: var(--lime);
        font-weight: 600; font-size: 15px; }
.band-text { margin-top: 14px; font-size: 17px; }
.split { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 26px; }
.split h3 { font-size: 15px; font-weight: 700; color: var(--muted); font-family: var(--body); letter-spacing: 0; margin-bottom: 8px; }
.split ul { list-style: none; padding: 0; margin: 0; }
.split li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; display: flex; justify-content: space-between; gap: 10px; }
.split li b { font-family: var(--display); }
.split .good b { color: var(--lime); }

.section { margin-top: 56px; }
.section > h2 { font-size: 28px; font-weight: 800; }
.section > p.sub { color: var(--muted); margin-top: 8px; max-width: 40em; }
.bars { margin-top: 22px; display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 2fr 34px; gap: 14px; align-items: center; font-size: 15px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--lime); border-radius: 99px; }
.bar.low .fill { background: #E9EFEC; opacity: .55; }
.bar b { font-family: var(--display); text-align: right; }

.plan { margin-top: 22px; display: grid; gap: 16px; }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
.plan-card .ph { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.plan-card h3 { font-size: 21px; font-weight: 800; }
.plan-card .nota { font-family: var(--display); font-weight: 700; color: var(--muted); white-space: nowrap; }
.plan-card .why { color: var(--muted); font-size: 15px; margin-top: 4px; }
.plan-card label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
.plan-card textarea { width: 100%; min-height: 92px; resize: vertical; background: var(--bg); border: 1px solid var(--line);
                      border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
.plan-card textarea:focus, .plan-card select:focus { border-color: var(--lime); outline: none; }
.prazo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.plan-card select { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 15px; }
.prazo .ate { color: var(--lime); font-weight: 600; font-size: 15px; }
.print-only { display: none; }

.status { margin-top: 18px; font-size: 15px; color: var(--muted); min-height: 24px; }
.status.ok { color: var(--lime); }
.status.err { color: var(--danger); }
.note { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.foot { margin-top: 48px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .intro .wheel-hero .poly, .intro .wheel-hero .dot { animation: none; } .btn, .scale button { transition: none; } }

@media (max-width: 720px) {
  .hero-res { grid-template-columns: 1fr; gap: 18px; }
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .shell { padding: 18px 18px 40px; }
  .scale { grid-template-columns: repeat(5, 1fr); }
  .row2 { grid-template-columns: 1fr; gap: 0; }
  .facts { grid-template-columns: 1fr; }
  .bar { grid-template-columns: minmax(0, 1.3fr) 1fr 30px; font-size: 14px; }
  .qnav .btn { padding: 14px 20px; }
  .radar-wrap svg .lbl { font-size: 21px; }
}

/* impressão / PDF */
.top .logo-print { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  :root { --bg: #fff; --surface: #F3F5F4; --surface-2: #E0E1E1; --line: #E0E1E1; --text: #091216; --muted: #5E6467; }
  body { background: #fff; color: #091216; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 12px; }
  .shell { max-width: none; padding: 0; }
  .no-print, .btn, .btn-link, .status { display: none !important; }
  .top .logo-screen { display: none !important; }
  .top .logo-print { display: block; height: 18px; }
  .score-big b { color: #091216; font-size: 54px; }
  .band { background: #C8F04A; color: #091216; }
  .split .good b { color: #091216; }
  .bar .fill { background: #091216; }
  .bar.low .fill { background: #9AA5A9; opacity: 1; }
  .radar-wrap { background: none; }
  .radar-wrap svg .rg { stroke: #C9D2D6 !important; }
  .radar-wrap svg .lbl { fill: #091216 !important; }
  .radar-wrap svg .poly { fill: rgba(200,240,74,.55) !important; stroke: #091216 !important; }
  .radar-wrap svg .dot { fill: #091216 !important; }
  .hero-res { grid-template-columns: 1.15fr 1fr; gap: 20px; }
  .split { margin-top: 14px; gap: 12px; }
  .section { margin-top: 22px; }
  .section > h2 { font-size: 20px; break-after: avoid; }
  .prazo .ate { color: #091216; }
  .res-head { margin-top: 16px; }
  .res-head h1 { font-size: 28px; }
  .bars { gap: 7px; margin-top: 12px; }
  .plan { gap: 10px; margin-top: 12px; }
  .plan-card { break-inside: avoid; background: #fff; border: 1px solid #E0E1E1; padding: 14px; }
  .plan-card textarea, .plan-card select, .plan-card label.edit { display: none !important; }
  .print-only { display: block; }
  .plan-card .print-only { margin-top: 8px; font-size: 13px; white-space: pre-wrap; }
  .note { margin-top: 18px; }
  .foot { margin-top: 18px; }
}
</style>
</head>

      ['nome', 'email', 'whatsapp', 'cargo', 'empresa'].forEach((k) => {
        if (e.data[k]) dadosPlataforma[k] = e.data[k];
        if (!S.dados[k] && e.data[k]) S.dados[k] = e.data[k];
      });
      salvar();
      if (S.tela === 'dados') render();
    });
    window.parent.postMessage({ tipo: 'mentorei-pronta' }, location.origin);
  }

  function carregar() { try { const v = localStorage.getItem(CONFIG.chaveMemoria); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function salvar() { try { localStorage.setItem(CONFIG.chaveMemoria, JSON.stringify(S)); } catch (e) { /* sem memória do navegador: segue normal */ } }

  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const emPrevia = () => !CONFIG.dominiosDeEnvio.some(d => location.hostname === d || location.hostname.endsWith('.' + d) || location.hostname.endsWith(d));

  function topo(extra = '') {
    return `<div class="top"><img class="logo logo-screen" src="${LOGO_BRANCO}" alt="Mentorei"><img class="logo logo-print" src="${LOGO_ESCURO}" alt="Mentorei">${extra}</div>`;
  }

  // ---------------------------------------------------------------
  // RODA (SVG)
  // ---------------------------------------------------------------
  function ponto(cx, cy, r, k, n) { const a = -Math.PI / 2 + (2 * Math.PI * k) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

  function rodaGrande(notas) {
    const n = notas.length, cx = 220, cy = 210, R = 140;
    let g = '';
    [2, 4, 6, 8, 10].forEach(v => {
      const pts = Array.from({ length: n }, (_, k) => ponto(cx, cy, R * v / 10, k, n).map(x => x.toFixed(1)).join(',')).join(' ');
      g += `<polygon class="rg" points="${pts}" fill="none" stroke="rgba(230,236,234,.14)" stroke-width="1"/>`;
    });
    for (let k = 0; k < n; k++) { const [x, y] = ponto(cx, cy, R, k, n); g += `<line class="rg" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(230,236,234,.14)"/>`; }
    const pts = notas.map((v, k) => ponto(cx, cy, R * (v || 0) / 10, k, n).map(x => x.toFixed(1)).join(',')).join(' ');
    g += `<polygon class="poly" points="${pts}" fill="rgba(200,240,74,.22)" stroke="#C8F04A" stroke-width="2.4" stroke-linejoin="round"/>`;
    notas.forEach((v, k) => { const [x, y] = ponto(cx, cy, R * (v || 0) / 10, k, n); g += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#C8F04A"/>`; });
    HABILIDADES.forEach((h, k) => {
      const [x, y] = ponto(cx, cy, R + 26, k, n);
      const anchor = Math.abs(x - cx) < 8 ? 'middle' : (x > cx ? 'start' : 'end');
      g += `<text class="lbl" x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}" font-family="Inter, sans-serif" font-size="16" fill="#B9C6C9">${esc(h.curto)} <tspan font-weight="700" fill="currentColor">${notas[k] ?? ''}</tspan></text>`;
    });
    return `<svg viewBox="-100 0 640 420" role="img" aria-label="Roda com as notas das 10 habilidades">${g}</svg>`;
  }

  function rodaMini(notas, atual) {
    const n = notas.length, c = 46, R = 38;
    let g = `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="rgba(230,236,234,.14)"/>`;
    for (let k = 0; k < n; k++) {
      const [x, y] = ponto(c, c, R, k, n);
      g += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(230,236,234,.12)" stroke-width="1"/>`;
      if (notas[k] != null) {
        const [px, py] = ponto(c, c, R * notas[k] / 10, k, n);
        g += `<line x1="${c}" y1="${c}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#C8F04A" stroke-width="5" stroke-linecap="round"/>`;
      }
      if (k === atual) g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#C8F04A"/>`;
    }
    return `<svg class="mini" viewBox="0 0 92 92" aria-hidden="true">${g}</svg>`;
  }

  // ---------------------------------------------------------------
  // TELAS
  // ---------------------------------------------------------------
  function telaAbertura() {
    const demo = [7, 5, 8, 6, 9, 4, 7, 6, 8, 5];
    app.innerHTML = `<div class="shell wide fade">${topo()}
      <section class="intro">
        <div class="wheel-hero" aria-hidden="true">${rodaGrande(demo).replace(/<text[\s\S]*?<\/text>/g, '').replace('viewBox="-100 0 640 420"', 'viewBox="70 60 300 300"')}</div>
        <div>
        <h1>Roda do Comunicador Influente</h1>
        <p class="lead">Avalie dez habilidades que fazem a diferença na forma como você se comunica e saia com um plano de ação para as três que mais pedem atenção.</p>
        <div class="facts"><div><b>10</b><span>habilidades</span></div><div><b>5 min</b><span>para responder</span></div><div><b>3</b><span>ações no seu plano</span></div></div>
        <div class="actions"><button class="btn btn-primary" id="comecar">Começar a autoavaliação</button>
        ${S.notas.some(v => v != null) && S.tela !== 'resultado' ? '<button class="btn btn-ghost" id="continuar">Continuar de onde parei</button>' : ''}</div>
        </div>
      </section>
      <div class="foot"><span>Mentorei</span><span>contato@mentorei.com.br</span></div></div>`;
    document.getElementById('comecar').onclick = () => { S = novoEstado(); S.tela = 'dados'; salvar(); render(); };
    const c = document.getElementById('continuar'); if (c) c.onclick = () => { S.tela = S.dados.nome ? 'pergunta' : 'dados'; render(); };
  }

  function telaDados() {
    const d = S.dados;
    app.innerHTML = `<div class="shell fade">${topo('<span class="meta">Antes de começar</span>')}
      <div class="form-head"><h2>Quem está respondendo?</h2><p>Seus dados aparecem no seu resultado e ajudam a Mentorei a acompanhar a sua evolução.</p></div>
      <form id="f" novalidate>
        <div class="field" data-k="nome"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" value="${esc(d.nome)}"><div class="err">Escreva o seu nome.</div></div>
        <div class="row2">
          <div class="field" data-k="email"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email" value="${esc(d.email)}"><div class="err">Confira o e-mail.</div></div>
          <div class="field" data-k="whatsapp"><label for="whatsapp">WhatsApp</label><input id="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="(19) 99999-9999" value="${esc(d.whatsapp)}"><div class="err">Escreva o WhatsApp com DDD.</div></div>
        </div>
        <div class="row2">
          <div class="field" data-k="cargo"><label for="cargo">Cargo</label><input id="cargo" autocomplete="organization-title" value="${esc(d.cargo)}"><div class="err">Escreva o seu cargo.</div></div>
          <div class="field" data-k="empresa"><label for="empresa">Empresa <small>(opcional)</small></label><input id="empresa" autocomplete="organization" value="${esc(d.empresa)}"></div>
        </div>
        <label class="consent"><input type="checkbox" id="consentimento" ${d.consentimento ? 'checked' : ''}>
          <span>Autorizo a Mentorei a guardar meus dados e minhas respostas para me enviar o resultado, conteúdos e acompanhar o meu desenvolvimento.</span></label>
        <div class="status err" id="cerr" hidden>Para continuar, marque a autorização acima.</div>
        <div class="actions"><button class="btn btn-primary" type="submit">Ir para as perguntas</button><button class="btn-link" type="button" id="voltar">Voltar</button></div>
      </form></div>`;
    const wa = document.getElementById('whatsapp');
    wa.addEventListener('input', () => {
      const n = wa.value.replace(/\D/g, '').slice(0, 11);
      wa.value = n.length > 6 ? `(${n.slice(0, 2)}) ${n.slice(2, n.length - 4)}-${n.slice(-4)}` : n.length > 2 ? `(${n.slice(0, 2)}) ${n.slice(2)}` : n;
    });
    document.getElementById('voltar').onclick = () => { S.tela = 'abertura'; render(); };
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      Object.assign(S.dados, { nome: v('nome'), email: v('email'), whatsapp: v('whatsapp'), cargo: v('cargo'), empresa: v('empresa'),
        consentimento: document.getElementById('consentimento').checked });
      const regras = { nome: x => x.length > 1, email: x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x), whatsapp: x => x.replace(/\D/g, '').length >= 10, cargo: x => x.length > 1 };
      let ok = true;
      document.querySelectorAll('.field').forEach(f => { const k = f.dataset.k; const bad = regras[k] && !regras[k](S.dados[k]); f.classList.toggle('invalid', !!bad); if (bad) ok = false; });
      document.getElementById('cerr').hidden = S.dados.consentimento;
      if (!S.dados.consentimento) ok = false;
      salvar();
      if (!ok) { const first = document.querySelector('.field.invalid input'); if (first) first.focus(); return; }
      S.tela = 'pergunta'; S.i = S.notas.findIndex(x => x == null); if (S.i < 0) S.i = 0; salvar(); render();
    };
  }

  function telaPergunta() {
    const i = S.i, h = HABILIDADES[i], nota = S.notas[i], ult = i === HABILIDADES.length - 1;
    const botoes = Array.from({ length: 10 }, (_, k) => `<button type="button" data-v="${k + 1}" aria-pressed="${nota === k + 1}" aria-label="Nota ${k + 1}">${k + 1}</button>`).join('');
    app.innerHTML = `<div class="shell">${topo(`<span class="meta">${esc(S.dados.nome.split(' ')[0] || '')}</span>`)}
      <div class="qtop">${rodaMini(S.notas, i)}<div class="count"><b>${i + 1}</b> de ${HABILIDADES.length}<br>Cada resposta preenche a sua roda</div></div>
      <section class="q fade" key="${i}">
        <h2>${esc(h.nome)}</h2>
        <p class="desc">${esc(h.desc)}</p>
        <p class="ask" id="ask">Quanto essa habilidade está desenvolvida em você hoje?</p>
        <div class="scale" role="group" aria-labelledby="ask">${botoes}</div>
        <div class="anchors"><span>1: preciso desenvolver muito</span><span>10: é um ponto forte meu</span></div>
        <div class="qnav"><button class="btn btn-ghost" id="ant">${i === 0 ? 'Meus dados' : 'Anterior'}</button>
          <button class="btn btn-primary" id="prox" ${nota == null ? 'disabled' : ''}>${ult ? 'Ver meu resultado' : 'Próxima'}</button></div>
        <p class="hint no-print">Dica: no computador, use as teclas de 1 a 9 e o 0 para a nota 10.</p>
      </section></div>`;
    let timer = null;
    app.querySelectorAll('.scale button').forEach(b => b.onclick = () => {
      S.notas[i] = +b.dataset.v; salvar();
      app.querySelectorAll('.scale button').forEach(x => x.setAttribute('aria-pressed', x === b));
      document.getElementById('prox').disabled = false;
      app.querySelector('.qtop .mini').outerHTML = rodaMini(S.notas, i);
      clearTimeout(timer);
      if (!ult) timer = setTimeout(() => { S.i = i + 1; salvar(); render(); }, 420);
    });
    document.getElementById('ant').onclick = () => { clearTimeout(timer); if (i === 0) S.tela = 'dados'; else S.i = i - 1; salvar(); render(); };
    document.getElementById('prox').onclick = () => { clearTimeout(timer); if (ult) { S.tela = 'resultado'; S.data = S.data || new Date().toISOString(); } else S.i = i + 1; salvar(); render(); };
  }

  // ---------------------------------------------------------------
  // RESULTADO
  // ---------------------------------------------------------------
  function calcular() {
    const notas = S.notas.map(v => v || 0);
    const media = notas.reduce((a, b) => a + b, 0) / notas.length;
    const faixa = FAIXAS.filter(f => media >= f.min).pop();
    const idx = notas.map((v, k) => ({ v, k }));
    const fortes = [...idx].sort((a, b) => b.v - a.v || a.k - b.k).slice(0, 3);
    const foco = [...idx].sort((a, b) => a.v - b.v || a.k - b.k).slice(0, 3);
    return { notas, media, faixa, fortes, foco };
  }
  const dataBR = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const prazoData = dias => { const base = S.data ? new Date(S.data) : new Date(); const d = new Date(base); d.setDate(d.getDate() + dias); return dataBR(d); };

  function telaResultado() {
    const R = calcular();
    R.foco.forEach(({ k }) => { if (!S.plano[k]) S.plano[k] = { acao: HABILIDADES[k].acao, dias: 30 }; });
    salvar();
    const quando = S.data ? dataBR(new Date(S.data)) : dataBR(new Date());
    const li = arr => arr.map(({ v, k }) => `<li><span>${esc(HABILIDADES[k].nome)}</span><b>${v}</b></li>`).join('');
    const focoSet = new Set(R.foco.map(x => x.k));
    const barras = HABILIDADES.map((h, k) => `<div class="bar ${focoSet.has(k) ? 'low' : ''}"><span>${esc(h.nome)}</span>
      <div class="track"><div class="fill" style="width:${R.notas[k] * 10}%"></div></div><b>${R.notas[k]}</b></div>`).join('');
    const cards = R.foco.map(({ v, k }, n) => {
      const p = S.plano[k];
      const opts = PRAZOS.map(d => `<option value="${d}" ${p.dias === d ? 'selected' : ''}>Em ${d} dias</option>`).join('');
      return `<div class="plan-card"><div class="ph"><h3>${esc(HABILIDADES[k].nome)}</h3><span class="nota">nota ${v}</span></div>
        <p class="why">${esc(HABILIDADES[k].desc)}</p>
        <label class="edit" for="a${k}">Minha ação</label>
        <textarea id="a${k}" data-k="${k}">${esc(p.acao)}</textarea>
        <div class="print-only"><b>Minha ação:</b> ${esc(p.acao)}</div>
        <label class="edit" for="d${k}">Prazo</label>
        <div class="prazo"><select id="d${k}" data-k="${k}" class="no-print">${opts}</select><span class="ate" id="ate${k}">até ${prazoData(p.dias)}</span></div>
      </div>`;
    }).join('');

    app.innerHTML = `<div class="shell wide fade">${topo(`<span class="meta">Roda do Comunicador Influente</span>`)}
      <header class="res-head"><p class="who">${esc(S.dados.nome)}${S.dados.cargo ? ', ' + esc(S.dados.cargo) : ''}${S.dados.empresa ? ' · ' + esc(S.dados.empresa) : ''} · ${quando}</p>
        <h1>Sua roda de comunicação</h1></header>
      <div class="hero-res">
        <div class="radar-wrap">${rodaGrande(R.notas)}</div>
        <div>
          <div class="score-big"><b>${R.media.toFixed(1).replace('.', ',')}</b><span>média de 0 a 10</span></div>
          <span class="band">${R.faixa.nome}</span>
          <p class="band-text">${R.faixa.texto}</p>
          <div class="split"><div class="good"><h3>Seus pontos fortes</h3><ul>${li(R.fortes)}</ul></div>
          <div><h3>Pedem mais atenção</h3><ul>${li(R.foco)}</ul></div></div>
        </div>
      </div>

      <section class="section"><h2>As 10 habilidades</h2><div class="bars">${barras}</div></section>

      <section class="section"><h2>Seu plano de ação</h2>
        <p class="sub">Uma ação para cada uma das três habilidades com nota mais baixa. A sugestão já vem preenchida: ajuste do seu jeito e escolha o prazo.</p>
        <div class="plan">${cards}</div>
        <div class="actions" style="margin-top:24px">
          <button class="btn btn-primary" id="enviar">Enviar meu plano para a Mentorei</button>
          <button class="btn btn-ghost" id="pdf">Baixar em PDF</button>
        </div>
        <p class="status" id="status"></p>
      </section>

      <p class="note">Esta é uma autoavaliação: ela mostra como você se percebe hoje. Para uma visão completa, compare com o retorno de colegas e da sua liderança.</p>
      <div class="foot"><span>Mentorei · contato@mentorei.com.br</span><button class="btn-link no-print" id="refazer">Refazer a autoavaliação</button></div>
    </div>`;

    const auto = t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };
    app.querySelectorAll('textarea[data-k]').forEach(t => { auto(t); t.addEventListener('input', () => auto(t)); });
    app.querySelectorAll('textarea[data-k]').forEach(t => t.oninput = () => {
      const k = t.dataset.k; S.plano[k].acao = t.value; t.nextElementSibling.innerHTML = '<b>Minha ação:</b> ' + esc(t.value); salvar();
    });
    app.querySelectorAll('select[data-k]').forEach(s => s.onchange = () => {
      const k = s.dataset.k; S.plano[k].dias = +s.value; document.getElementById('ate' + k).textContent = 'até ' + prazoData(+s.value); salvar();
    });
    document.getElementById('pdf').onclick = () => window.print();
    document.getElementById('refazer').onclick = () => { S = novoEstado(); salvar(); render(); window.scrollTo(0, 0); };
    document.getElementById('enviar').onclick = () => enviar('plano enviado pelo participante', true);
    if (!S.enviado) enviar('resultado automático', false);
  }

  function pacote(origem) {
    const R = calcular();
    const notas = HABILIDADES.map((h, k) => `${h.nome}: ${R.notas[k]}`).join('\n');
    const plano = R.foco.map(({ k }) => `${HABILIDADES[k].nome} (nota ${R.notas[k]}): ${S.plano[k]?.acao || ''} | prazo: até ${prazoData(S.plano[k]?.dias || 30)}`).join('\n');
    return { 'form-name': CONFIG.nomeFormulario, 'bot-field': '', origem, nome: S.dados.nome, email: S.dados.email, whatsapp: S.dados.whatsapp,
      cargo: S.dados.cargo, empresa: S.dados.empresa, consentimento: S.dados.consentimento ? 'sim' : 'não',
      media: R.media.toFixed(1).replace('.', ','), faixa: R.faixa.nome, notas, plano, data: S.data ? dataBR(new Date(S.data)) : dataBR(new Date()) };
  }

  async function enviar(origem, manual) {
    const st = document.getElementById('status');
    const msg = (t, cls) => { if (st) { st.textContent = t; st.className = 'status ' + (cls || ''); } };
    if (naPlataforma) {
      const R = calcular();
      window.parent.postMessage({ tipo: 'mentorei-resultado', manual, pacote: pacote(origem),
        notas: HABILIDADES.map((h, k) => ({ habilidade: h.nome, nota: R.notas[k] })) }, location.origin);
      S.enviado = true; salvar();
      if (manual) msg('Plano guardado na sua área da plataforma. Seu mentor já pode ver.', 'ok');
      return;
    }
    if (emPrevia()) {
      S.enviado = true; salvar();
      if (manual) msg('Prévia: na versão publicada, o plano será enviado para a Mentorei neste momento.', 'ok');
      return;
    }
    if (manual) msg('Enviando…');
    try {
      const r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(pacote(origem)).toString() });
      if (!r.ok) throw new Error(r.status);
      S.enviado = true; salvar();
      if (manual) msg('Plano enviado. A Mentorei recebeu uma cópia do seu resultado.', 'ok');
    } catch (e) {
      if (manual) msg('Não foi possível enviar agora. Verifique a internet e tente de novo.', 'err');
    }
  }

  // ---------------------------------------------------------------
  function render() {
    ({ abertura: telaAbertura, dados: telaDados, pergunta: telaPergunta, resultado: telaResultado }[S.tela] || telaAbertura)();
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('keydown', e => {
    if (S.tela !== 'pergunta' || /input|textarea|select/i.test(e.target.tagName)) return;
    const n = e.key === '0' ? 10 : parseInt(e.key, 10);
    if (n >= 1 && n <= 10) { const b = app.querySelector(`.scale button[data-v="${n}"]`); if (b) b.click(); }
    if (e.key === 'Enter') { const p = document.getElementById('prox'); if (p && !p.disabled) p.click(); }
    if (e.key === 'ArrowLeft') { const a = document.getElementById('ant'); if (a) a.click(); }
  });

  render();
})();
</script>
</body>
</html>
