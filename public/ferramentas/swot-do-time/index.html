<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWOT do Time · Mentorei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Padrão das ferramentas automatizadas Mentorei: preto profundo + verde-lima, Manrope nos títulos, Inter no texto.
   Layout: coluna única de leitura; quadrantes SWOT 2x2 com uma cor por quadrante. */
:root {
  --bg: #091216; --surface: #0F1D23; --surface-2: #142731; --line: rgba(230,236,234,.12);
  --text: #E9EFEC; --muted: #93A3A8; --lime: #C8F04A; --lime-soft: rgba(200,240,74,.14); --on-lime: #091216;
  --danger: #FF8A7A;
  --q-f: #C8F04A; --q-w: #F2B85B; --q-o: #7ED6C1; --q-t: #FF8A7A;
  --mint-soft: rgba(126,214,193,.11); --gentil: #D4EFE6;
  --display: 'Manrope', 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #091216; --text: #E9EFEC; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #091216; --text: #E9EFEC; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
       -webkit-font-smoothing: antialiased; min-height: 100vh; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
p { margin: 0; }

.shell { max-width: 760px; margin: 0 auto; padding: 22px 20px 48px; }
.shell.wide { max-width: 1060px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
.top .logo { height: 22px; width: auto; display: block; }
.top .logo-print { display: none; }
.top .meta { color: var(--muted); font-size: 14px; text-align: right; }

.btn { appearance: none; border: 0; cursor: pointer; border-radius: 999px; padding: 15px 26px; font-weight: 600; font-size: 16px;
       display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .12s ease, opacity .2s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--lime); color: var(--on-lime); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn-sm { padding: 10px 18px; font-size: 15px; }
.btn-link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: 15px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* formulário de dados */
.form-head { margin: 40px 0 26px; }
.form-head h2 { font-size: 32px; font-weight: 800; line-height: 1.1; }
.form-head p { color: var(--muted); margin-top: 10px; max-width: 40em; }
.field { margin-bottom: 18px; min-width: 0; }
.field label { display: block; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.field label small { color: var(--muted); font-weight: 400; }
.field input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 16px; }
.field input:focus { border-color: var(--lime); outline: none; }
.field .err { color: var(--danger); font-size: 14px; margin-top: 6px; display: none; }
.field.invalid input { border-color: var(--danger); }
.field.invalid .err { display: block; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); margin: 6px 0 26px; cursor: pointer; }
.consent input { width: 20px; height: 20px; accent-color: var(--lime); margin-top: 2px; flex-shrink: 0; }

/* abertura */
.intro { padding-top: 6vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 52px; align-items: center; }
.intro h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.02; font-weight: 800; }
.intro .lead { font-size: 19px; color: var(--muted); margin-top: 18px; max-width: 32em; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 16px; overflow: hidden; margin: 30px 0 32px; }
.facts div { background: var(--surface); padding: 16px 18px; }
.facts b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--lime); }
.facts span { font-size: 14px; color: var(--muted); }

.board { order: 2; justify-self: center; width: min(100%, 470px); display: grid; grid-template-columns: 22px 1fr 1fr; gap: 10px; }
.board .colh { font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .04em; text-transform: uppercase; }
.board .rowh { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .04em; text-transform: uppercase; }
.cell { background: var(--surface); border-radius: 18px; padding: 16px 16px 18px; display: grid; gap: 9px; align-content: start; min-height: 128px; }
.cell .cl { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 17px; margin-bottom: 4px; }
.cell .cl::before, .qh::before, .pc::before, .mq .k::before, .tagq::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--qc); flex-shrink: 0; }
.cell i { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); transform-origin: left center; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.cell i:first-of-type { background: var(--qc); opacity: .8; }
.cell i:nth-of-type(2) { width: 82%; animation-delay: .15s; }
.cell i:nth-of-type(3) { width: 64%; animation-delay: .3s; }
@keyframes grow { from { transform: scaleX(.2); } to { transform: none; } }
.pairdemo { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; background: var(--surface); border-radius: 22px; padding: 8px; animation: rise .7s ease .9s both; }
.pairdemo .who { border-radius: 999px; padding: 8px 14px; background: var(--surface-2); font-weight: 600; font-size: 15px; }
.pairdemo .who.m { background: var(--lime); color: var(--on-lime); }
.pairdemo .via { font-size: 14px; color: var(--muted); }
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
.q-f { --qc: var(--q-f); } .q-w { --qc: var(--q-w); } .q-o { --qc: var(--q-o); } .q-t { --qc: var(--q-t); }

/* time */
.dica { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 14px 16px; font-size: 15px; color: var(--muted); margin-bottom: 18px; }
.dica b { color: var(--text); font-weight: 600; }
.pessoas { display: grid; gap: 14px; }
.pessoa { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.pessoa.incomplete { border-color: rgba(126,214,193,.55); }
.phead { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: 0; cursor: pointer; text-align: left; border-radius: 20px; }
.av { flex: 0 0 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
.pessoa.ok .av { background: var(--lime); color: var(--on-lime); }
.pname { flex: 1; min-width: 0; }
.pname b { display: block; font-family: var(--display); font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname small { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcounts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 64%; }
.pc { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pc.cheio { color: var(--text); }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; flex-shrink: 0; margin: 0 4px 4px; }
.pessoa.open .chev { transform: rotate(-135deg); margin-bottom: -4px; }
.pbody { padding: 2px 18px 18px; }
.pbody .field input { background: var(--bg); }
.quads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quad { background: var(--bg); border-radius: 16px; padding: 14px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.qh { display: flex; align-items: center; gap: 8px; }
.qh h4 { font-size: 16px; font-weight: 800; flex: 1; }
.qn { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qn.ok { color: var(--qc); }
.qhint { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; }
.slots li { display: flex; align-items: center; gap: 6px; }
.slots li::before { counter-increment: s; content: counter(s); width: 14px; font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.slot { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.slot:focus { border-color: var(--qc); outline: none; }
.slot::placeholder { color: rgba(147,163,168,.65); }
.xslot { flex: 0 0 30px; height: 30px; background: none; border: 0; color: var(--muted); cursor: pointer; border-radius: 50%; font-size: 20px; line-height: 1; }
.xslot:hover { background: var(--surface-2); color: var(--text); }
.qadd { justify-self: start; background: none; border: 0; color: var(--qc); font-weight: 600; cursor: pointer; padding: 2px 0 2px 20px; font-size: 14px; }
.qmax { font-size: 13px; color: var(--muted); padding-left: 20px; }
.ideias { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-left: 20px; }
.ideias > span { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.ideia { border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.ideia:hover { color: var(--text); }
.ideia[aria-pressed="true"] { border-color: var(--qc); color: var(--text); }
.gentil { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: var(--gentil); background: var(--mint-soft); border-radius: 12px; padding: 10px 12px; line-height: 1.45; animation: rise .35s ease both; }
.gentil svg { flex: 0 0 16px; margin-top: 2px; }
.pfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.rm { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; text-decoration: underline; padding: 6px 0; }
.rm.confirmar { color: var(--danger); }
.addbtn { margin-top: 14px; width: 100%; border: 1px dashed rgba(200,240,74,.5); background: transparent; color: var(--lime); border-radius: 16px; padding: 16px; font-weight: 600; cursor: pointer; }
.formerr { color: var(--danger); font-size: 15px; margin-top: 16px; }

/* resultado */
.res-head { margin: 34px 0 6px; }
.res-head .who { color: var(--muted); font-size: 15px; }
.res-head h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 800; line-height: 1.05; margin-top: 6px; }
.res-head .sum { color: var(--muted); margin-top: 10px; font-size: 16px; }
.hero-res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 24px; align-items: stretch; }
.big { background: var(--surface); border-radius: 22px; padding: 22px; min-width: 0; }
.big .k { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.big .v { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.15; margin-top: 6px; color: var(--qc); }
.big .quem { font-size: 15px; color: var(--muted); margin-top: 6px; }
.big p.leit { margin-top: 12px; font-size: 16px; }
.section { margin-top: 50px; }
.section > h2 { font-size: 28px; font-weight: 800; }
.section > p.sub { color: var(--muted); margin-top: 8px; max-width: 44em; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.pcard { background: var(--surface); border-radius: 20px; padding: 20px; min-width: 0; }
.pcard > .k { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.freq { display: grid; gap: 12px; margin-top: 16px; }
.freq .f { display: grid; grid-template-columns: minmax(0, 1.3fr) 1.7fr 40px; gap: 6px 12px; align-items: center; font-size: 15px; }
.freq .f > span { min-width: 0; overflow-wrap: anywhere; }
.freq .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.freq .fill { height: 100%; background: var(--qc); border-radius: 99px; }
.freq b { font-family: var(--display); text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.freq .nm { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
.vazio { color: var(--muted); font-size: 15px; margin-top: 12px; }
.pontos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.ponto { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.ponto .tag { justify-self: start; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); }
.ponto .tag.combo { background: rgba(255,138,122,.16); color: #FFC1B7; }
.ponto h3 { font-size: 20px; font-weight: 800; line-height: 1.25; }
.ponto p { font-size: 15.5px; }
.ponto .faz { background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.ponto .faz b { display: block; color: var(--lime); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.duplas { display: grid; gap: 10px; margin-top: 18px; }
.dupla { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr); gap: 14px; align-items: center; background: var(--surface); border-radius: 18px; padding: 16px 18px; }
.dupla .pess { min-width: 0; }
.dupla .pess .k { font-size: 13px; color: var(--muted); }
.dupla .pess .nome { font-family: var(--display); font-size: 19px; font-weight: 800; line-height: 1.2; }
.dupla .pess small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; overflow-wrap: anywhere; }
.dupla .pess.m { text-align: right; }
.dupla .tema { justify-self: center; text-align: center; border: 1px solid rgba(200,240,74,.55); background: var(--lime-soft); color: var(--lime); border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600; max-width: 260px; }
.comofaz { margin-top: 16px; }
.comofaz ul { margin: 10px 0 0; padding-left: 20px; }
.comofaz li { padding: 3px 0; }
.chipline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tagq { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding: 7px 12px; border-radius: 999px; background: var(--bg); }
.tagq b { font-family: var(--display); font-variant-numeric: tabular-nums; }
.pcard p.leit { margin-top: 14px; font-size: 15px; }
.pcard p.leit b { font-weight: 600; }
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 14px; margin-top: 18px; }
.map { background: var(--surface); border-radius: 20px; padding: 18px; min-width: 0; }
.map h3 { font-size: 19px; font-weight: 800; }
.map .fn { color: var(--muted); font-size: 14px; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 12px; }
.mq { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.mq .k { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.mq ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.mq li { padding: 1px 0; overflow-wrap: anywhere; }
.reflect { margin-top: 50px; background: var(--surface); border-radius: 20px; padding: 22px; }
.reflect h2 { font-size: 22px; font-weight: 800; }
.reflect ul { margin: 12px 0 0; padding-left: 20px; }
.reflect li { padding: 4px 0; }
.status { margin-top: 18px; font-size: 15px; color: var(--muted); min-height: 24px; }
.status.ok { color: var(--lime); } .status.err { color: var(--danger); }
.note { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.foot { margin-top: 44px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fade { animation: fade .35s ease both; }
@keyframes fade { from { transform: translateY(6px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .cell i, .pairdemo, .gentil { animation: none; } .chev { transition: none; } }

@media (max-width: 860px) {
  .intro { grid-template-columns: 1fr; gap: 30px; padding-top: 3vh; }
  .board { order: 0; justify-self: start; }
  .hero-res, .grid2, .pontos { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .quads { grid-template-columns: 1fr; }
  .phead { flex-wrap: wrap; }
  .pcounts { order: 3; max-width: none; width: 100%; justify-content: flex-start; padding-left: 54px; }
}
@media (max-width: 600px) {
  .shell { padding: 18px 16px 40px; }
  .row2 { grid-template-columns: 1fr; gap: 0; }
  .facts { grid-template-columns: 1fr; }
  .board { grid-template-columns: 18px 1fr 1fr; gap: 8px; }
  .cell { padding: 13px 12px 14px; min-height: 108px; }
  .cell .cl { font-size: 15px; }
  .pbody { padding: 2px 12px 14px; }
  .quad { padding: 12px; }
  .dupla { grid-template-columns: 1fr; gap: 8px; }
  .dupla .pess.m { text-align: left; }
  .dupla .tema { justify-self: start; text-align: left; }
  .mgrid { grid-template-columns: 1fr; }
}
@media print {
  @page { size: A4; margin: 14mm; }
  :root { --bg: #fff; --surface: #F3F5F4; --surface-2: #E0E1E1; --line: #E0E1E1; --text: #091216; --muted: #5E6467; --lime-soft: #F6FBE4; color-scheme: light; }
  body { background: #fff; color: #091216; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .shell { max-width: none; padding: 0; }
  .no-print, .btn, .btn-link, .status { display: none !important; }
  .top .logo-screen { display: none !important; }
  .top .logo-print { display: block; height: 18px; }
  .res-head h1 { font-size: 26px; }
  .big .v { color: #091216; }
  .dupla .tema { color: #091216; border-color: #C8F04A; }
  .ponto .tag.combo { color: #8A2A1C; }
  .ponto .faz b { color: #091216; }
  .section { margin-top: 22px; }
  .section > h2 { font-size: 20px; break-after: avoid; page-break-after: avoid; }
  .big, .pcard, .ponto, .dupla, .map, .reflect { break-inside: avoid; background: #fff; border: 1px solid #E0E1E1; }
  .mq, .ponto .faz, .tagq { background: #F3F5F4; }
  .reflect { margin-top: 22px; }
}
</style>
</head>
<body>
<form name="swot-do-time" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="origem"><input name="nome"><input name="email"><input name="whatsapp">
  <input name="cargo"><input name="empresa"><input name="time"><input name="consentimento"><input name="colaboradores">
  <textarea name="forcas_frequentes"></textarea><textarea name="fraquezas_frequentes"></textarea>
  <textarea name="pontos_de_atencao"></textarea><textarea name="duplas"></textarea>
  <textarea name="swot_individual"></textarea><input name="data">
</form>

<main id="app" aria-live="polite"></main>

<script>

  const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const reCache = new Map();
  function posicao(txtN, kw) {
    let r = reCache.get(kw);
    if (!r) { const k = norm(kw); r = new RegExp('(?:^|\\s)' + k.replace(/ /g, '\\s') + (k.length <= 3 ? '(?=\\s|$)' : '')); reCache.set(kw, r); }
    const m = r.exec(txtN); return m ? m.index + (m[0].charAt(0) === ' ' ? 1 : 0) : -1;
  }
  function melhorTema(txtN, dic) {
    let best = null;
    for (const t of dic) for (const kw of t.kw) {
      const i = posicao(txtN, kw); if (i < 0) continue;
      if (!best || i < best.i || (i === best.i && kw.length > best.L)) best = { i, L: kw.length, t };
    }
    return best ? best.t : null;
  }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const temaCache = new Map();
  function tema(txt, q) {
    const n = norm(txt); const ck = q + '|' + n;
    if (temaCache.has(ck)) return temaCache.get(ck);
    const t = (q === 'f' || q === 'w') ? melhorTema(n, COMP) : (melhorTema(n, EXT) || melhorTema(n, COMP));
    const r = t ? { key: t.key, rot: t.rot, def: t } : { key: 'x:' + n, rot: cap(txt.trim().replace(/\.$/, '')), def: null };
    temaCache.set(ck, r); return r;
  }

  // ------------------------------------------------------------ estado
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const novaPessoa = () => ({ id: uid(), nome: '', funcao: '', f: ['', '', ''], w: ['', '', ''], o: ['', '', ''], t: ['', '', ''], aberto: true, checado: false });

  let S = carregar() || novoEstado();

  // Dentro da plataforma de mentorias (aberta num quadro da própria plataforma): recebe os dados do

  const naPlataforma = window.parent !== window;
  if (naPlataforma) {
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.tipo !== 'mentorei-dados') return;
      ['nome', 'email', 'whatsapp', 'cargo', 'empresa'].forEach((k) => {
        if (e.data[k]) dadosPlataforma[k] = e.data[k];
        if (!S.dados[k] && e.data[k]) S.dados[k] = e.data[k];
      });
      salvar();
      if (S.tela === 'dados') render();
    });
    window.parent.postMessage({ tipo: 'mentorei-pronta' }, location.origin);
  }
  function carregar() { try { const v = localStorage.getItem(CONFIG.chaveMemoria); const o = v ? JSON.parse(v) : null; return o && Array.isArray(o.pessoas) ? o : null; } catch (e) { return null; } }
  function salvar() { try { localStorage.setItem(CONFIG.chaveMemoria, JSON.stringify(S)); } catch (e) {} }

  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const emPrevia = () => !CONFIG.dominiosDeEnvio.some(d => location.hostname === d || location.hostname.endsWith('.' + d));
  const dataBR = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  function itens(p, q) {
    const vistos = new Set(), out = [];
    (p[q] || []).forEach(v => { const t = String(v || '').trim(); const n = norm(t); if (n && !vistos.has(n)) { vistos.add(n); out.push(t); } });
    return out;
  }
  const completa = p => !!p.nome.trim() && QUADS.every(q => itens(p, q.k).length >= CONFIG.min);
  const vazia = p => !p.nome.trim() && !p.funcao.trim() && QUADS.every(q => !itens(p, q.k).length);

  function telaDados() {
    const d = S.dados;
    app.innerHTML = `<div class="shell fade">${topo('<span class="meta">Etapa 1 de 2</span>')}
      <div class="form-head"><h2>Quem está fazendo a análise?</h2><p>Seus dados aparecem no relatório e ajudam a Mentorei a acompanhar a evolução do seu time.</p></div>

        <div class="row2">
          <div class="field" data-k="email"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email" value="${esc(d.email)}"><div class="err">Confira o e-mail.</div></div>
          <div class="field" data-k="whatsapp"><label for="whatsapp">WhatsApp</label><input id="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="(19) 99999-9999" value="${esc(d.whatsapp)}"><div class="err">Escreva o WhatsApp com DDD.</div></div>
        </div>
        <div class="row2">
          <div class="field" data-k="cargo"><label for="cargo">Cargo</label><input id="cargo" autocomplete="organization-title" value="${esc(d.cargo)}"><div class="err">Escreva o seu cargo.</div></div>
          <div class="field" data-k="empresa"><label for="empresa">Empresa <small>(opcional)</small></label><input id="empresa" autocomplete="organization" value="${esc(d.empresa)}"></div>
        </div>
        <div class="field" data-k="time"><label for="time">Nome do time ou da área <small>(opcional)</small></label><input id="time" placeholder="Ex.: Atendimento da agência Centro" value="${esc(d.time)}"></div>
        <label class="consent"><input type="checkbox" id="consentimento" ${d.consentimento ? 'checked' : ''}>
          <span>Autorizo a Mentorei a guardar meus dados e as respostas desta análise para me enviar o relatório, conteúdos e acompanhar o desenvolvimento do meu time.</span></label>
        <div class="status err" id="cerr" hidden>Para continuar, marque a autorização acima.</div>
        <div class="actions"><button class="btn btn-primary" type="submit">Continuar</button><button class="btn-link" type="button" id="voltar">Voltar</button></div>
      </form></div>`;
    const wa = document.getElementById('whatsapp');
    wa.addEventListener('input', () => {
      const n = wa.value.replace(/\D/g, '').slice(0, 11);
      wa.value = n.length > 6 ? `(${n.slice(0, 2)}) ${n.slice(2, n.length - 4)}-${n.slice(-4)}` : n.length > 2 ? `(${n.slice(0, 2)}) ${n.slice(2)}` : n;
    });
    document.getElementById('voltar').onclick = () => { S.tela = 'abertura'; render(); };
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      Object.assign(S.dados, { nome: v('nome'), email: v('email'), whatsapp: v('whatsapp'), cargo: v('cargo'), empresa: v('empresa'), time: v('time'), consentimento: document.getElementById('consentimento').checked });
      const regras = { nome: x => x.length > 1, email: x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x), whatsapp: x => x.replace(/\D/g, '').length >= 10, cargo: x => x.length > 1 };
      let ok = true;
      document.querySelectorAll('.field').forEach(f => { const k = f.dataset.k; const bad = regras[k] && !regras[k](S.dados[k]); f.classList.toggle('invalid', !!bad); if (bad) ok = false; });
      document.getElementById('cerr').hidden = S.dados.consentimento;
      if (!S.dados.consentimento) ok = false;
      salvar();
      if (!ok) { const first = document.querySelector('.field.invalid input'); if (first) first.focus(); return; }
      S.tela = 'time'; salvar(); render();
    };
  }

  // ------------------------------------------------------------ time
  function contagens(p) {
    return QUADS.map(q => { const n = itens(p, q.k).length; return `<span class="pc q-${q.k} ${n >= CONFIG.min ? 'cheio' : ''}" title="${q.nome}: ${n}">${q.k === 'o' ? 'Oport.' : q.nome} ${n}</span>`; }).join('');
  }
  function quadHTML(p, i, q) {
    const n = itens(p, q.k).length; const vals = p[q.k];
    const tem = new Set(vals.map(norm).filter(Boolean));
    const slots = vals.map((v, k) => `<li><input class="slot" id="s-${p.id}-${q.k}-${k}" data-i="${i}" data-q="${q.k}" data-k="${k}" value="${esc(v)}"
        placeholder="${k < 3 ? esc(q.ph[k]) : 'Mais uma ' + q.um + ' (opcional)'}" autocomplete="off" aria-label="${q.nome}, item ${k + 1}">${k >= CONFIG.min ? `<button type="button" class="xslot" data-x="${k}" data-i="${i}" data-q="${q.k}" aria-label="Remover item ${k + 1}">×</button>` : ''}</li>`).join('');
    const ideias = q.ideias.map(t => `<button type="button" class="ideia" data-i="${i}" data-q="${q.k}" data-ideia="${esc(t)}" aria-pressed="${tem.has(norm(t))}">${esc(t)}</button>`).join('');
    return `<div class="quad q-${q.k}" data-quad="${q.k}">
      <div class="qh"><h4>${q.nome}</h4><span class="qn ${n >= CONFIG.min ? 'ok' : ''}" data-qn>${n} de ${CONFIG.max}</span></div>
      <p class="qhint">${q.hint}</p>
      <ol class="slots">${slots}</ol>
      ${vals.length < CONFIG.max ? `<button type="button" class="qadd" data-add="${q.k}" data-i="${i}">+ Adicionar mais uma</button>` : `<p class="qmax">Limite de ${CONFIG.max} ${q.nome.toLowerCase()} por pessoa.</p>`}
      <div class="ideias"><span>Ideias rápidas:</span>${ideias}</div>
      <p class="gentil" data-gentil ${p.checado && n < CONFIG.min ? '' : 'hidden'}>${CORACAO}<span>${GENTIL}</span></p>
    </div>`;
  }
  function cardPessoa(p, i) {
    const ok = completa(p), inc = p.checado && !ok;
    return `<div class="pessoa ${p.aberto ? 'open' : ''} ${ok ? 'ok' : ''} ${inc ? 'incomplete' : ''}" data-card="${i}">
      <button type="button" class="phead" data-toggle="${i}" aria-expanded="${p.aberto}">
        <span class="av" aria-hidden="true">${esc((primeiro(p).charAt(0) || String(i + 1)).toUpperCase())}</span>
        <span class="pname"><b>${esc(p.nome.trim() || 'Colaborador ' + (i + 1))}</b><small>${esc(p.funcao.trim() || (ok ? 'SWOT completo' : 'Toque para preencher'))}</small></span>
        <span class="pcounts">${contagens(p)}</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="pbody" ${p.aberto ? '' : 'hidden'}>
        <div class="row2">
          <div class="field ${inc && !p.nome.trim() ? 'invalid' : ''}" data-k="pnome"><label for="pn-${p.id}">Nome</label><input id="pn-${p.id}" data-i="${i}" data-pf="nome" value="${esc(p.nome)}" placeholder="Ex.: Carla" autocomplete="off"><div class="err">Escreva o nome da pessoa.</div></div>
          <div class="field"><label for="pf-${p.id}">Função <small>(opcional)</small></label><input id="pf-${p.id}" data-i="${i}" data-pf="funcao" value="${esc(p.funcao)}" placeholder="Ex.: Assistente de atendimento" autocomplete="off"></div>
        </div>
        <div class="quads">${QUADS.map(q => quadHTML(p, i, q)).join('')}</div>
        <div class="pfoot"><button type="button" class="rm" data-rm="${i}">Remover ${esc(primeiro(p) || 'colaborador')}</button>
          <button type="button" class="btn btn-ghost btn-sm" data-done="${i}">Concluir ${esc(primeiro(p) || 'colaborador')}</button></div>
      </div>
    </div>`;
  }

  function telaTime() {
    app.innerHTML = `<div class="shell fade">${topo('<span class="meta">Etapa 2 de 2</span>')}
      <div class="form-head"><h2>O SWOT de cada pessoa</h2><p>Adicione quantas pessoas quiser. Para cada uma, escreva de 3 a 5 itens em cada quadrante. Pense em comportamentos que você já viu acontecer.</p></div>
      <div class="dica"><span><b>Use só o primeiro nome.</b> Esta análise serve para desenvolver o time, não para avaliar desempenho. O relatório junta as respostas parecidas, mesmo escritas com palavras diferentes.</span></div>
      <div class="pessoas" id="lista">${S.pessoas.map(cardPessoa).join('')}</div>
      <button class="addbtn" id="add">Adicionar colaborador</button>
      <p class="formerr" id="ferr" hidden></p>
      <div class="actions" style="margin-top:28px"><button class="btn btn-primary" id="gerar">Gerar relatório do time</button><button class="btn-link" id="voltar">Voltar</button></div>
    </div>`;
    const lista = document.getElementById('lista');
    const cardEl = i => lista.querySelector(`[data-card="${i}"]`);
    const refazCard = (i, foco) => {
      const el = cardEl(i); if (!el) return;
      el.outerHTML = cardPessoa(S.pessoas[i], i);
      if (foco) { const f = document.getElementById(foco); if (f) { f.focus(); const L = f.value.length; try { f.setSelectionRange(L, L); } catch (e) {} } }
    };
    const refazLista = () => { lista.innerHTML = S.pessoas.map(cardPessoa).join(''); };
    function atualizaCabeca(i) {
      const p = S.pessoas[i], el = cardEl(i); if (!el) return;
      const ok = completa(p), inc = p.checado && !ok;
      el.classList.toggle('ok', ok); el.classList.toggle('incomplete', inc);
      el.querySelector('.pcounts').innerHTML = contagens(p);
      el.querySelector('.pname b').textContent = p.nome.trim() || 'Colaborador ' + (i + 1);
      el.querySelector('.pname small').textContent = p.funcao.trim() || (ok ? 'SWOT completo' : 'Toque para preencher');
      el.querySelector('.av').textContent = (primeiro(p).charAt(0) || String(i + 1)).toUpperCase();
      el.querySelector('[data-rm]').textContent = 'Remover ' + (primeiro(p) || 'colaborador');
      el.querySelector('[data-done]').textContent = 'Concluir ' + (primeiro(p) || 'colaborador');
      if (p.nome.trim()) { const f = el.querySelector('[data-k="pnome"]'); if (f) f.classList.remove('invalid'); }
    }
    function atualizaQuad(i, qk) {
      const p = S.pessoas[i], el = cardEl(i); if (!el) return;
      const box = el.querySelector(`[data-quad="${qk}"]`); const n = itens(p, qk).length;
      const qn = box.querySelector('[data-qn]'); qn.textContent = `${n} de ${CONFIG.max}`; qn.classList.toggle('ok', n >= CONFIG.min);
      box.querySelector('[data-gentil]').hidden = !(p.checado && n < CONFIG.min);
      const tem = new Set(p[qk].map(norm).filter(Boolean));
      box.querySelectorAll('.ideia').forEach(b => b.setAttribute('aria-pressed', tem.has(norm(b.dataset.ideia))));
    }
    function fechaOutros(exceto) {
      S.pessoas.forEach((p, k) => { if (k !== exceto && p.aberto) { p.aberto = false; if (!vazia(p) && !completa(p)) p.checado = true; } });
    }

    lista.addEventListener('input', e => {
      const el = e.target, i = +el.dataset.i, p = S.pessoas[i]; if (!p) return;
      if (el.dataset.pf) { p[el.dataset.pf] = el.value; atualizaCabeca(i); }
      else if (el.dataset.q) { p[el.dataset.q][+el.dataset.k] = el.value; atualizaQuad(i, el.dataset.q); atualizaCabeca(i); }
      document.getElementById('ferr').hidden = true;
      salvar();
    });
    lista.addEventListener('keydown', e => {
      const el = e.target; if (e.key !== 'Enter' || !el.classList.contains('slot')) return;
      e.preventDefault();
      const i = +el.dataset.i, q = el.dataset.q, k = +el.dataset.k, p = S.pessoas[i];
      const prox = document.getElementById(`s-${p.id}-${q}-${k + 1}`);
      if (prox) prox.focus();
      else if (p[q].length < CONFIG.max && el.value.trim()) { p[q].push(''); salvar(); refazCard(i, `s-${p.id}-${q}-${k + 1}`); }
    });
    lista.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.toggle != null) {
        const i = +b.dataset.toggle, p = S.pessoas[i];
        p.aberto = !p.aberto; if (!p.aberto && !vazia(p) && !completa(p)) p.checado = true;
        salvar(); refazCard(i); return;
      }
      const i = +b.dataset.i, p = S.pessoas[i];
      if (b.dataset.add) { const q = b.dataset.add; if (p[q].length < CONFIG.max) { p[q].push(''); salvar(); refazCard(i, `s-${p.id}-${q}-${p[q].length - 1}`); } return; }
      if (b.dataset.x != null) { p[b.dataset.q].splice(+b.dataset.x, 1); salvar(); refazCard(i); return; }
      if (b.dataset.ideia) {
        const q = b.dataset.q, alvo = norm(b.dataset.ideia), arr = p[q];
        const j = arr.findIndex(v => norm(v) === alvo);
        if (j >= 0) { if (j >= CONFIG.min) arr.splice(j, 1); else arr[j] = ''; }
        else { const vaga = arr.findIndex(v => !v.trim()); if (vaga >= 0) arr[vaga] = b.dataset.ideia; else if (arr.length < CONFIG.max) arr.push(b.dataset.ideia); else return; }
        salvar(); refazCard(i); return;
      }
      if (b.dataset.rm != null) {
        const k = +b.dataset.rm, alvo = S.pessoas[k];
        if (!vazia(alvo) && !b.classList.contains('confirmar')) {
          b.classList.add('confirmar'); b.textContent = `Confirmar: remover ${primeiro(alvo) || 'colaborador'} e tudo o que foi escrito`;
          setTimeout(() => { if (b.isConnected) { b.classList.remove('confirmar'); b.textContent = 'Remover ' + (primeiro(alvo) || 'colaborador'); } }, 5000); return;
        }
        S.pessoas.splice(k, 1); if (!S.pessoas.length) S.pessoas.push(novaPessoa());
        salvar(); refazLista(); return;
      }
      if (b.dataset.done != null) {
        const k = +b.dataset.done, alvo = S.pessoas[k];
        if (completa(alvo)) {
          alvo.aberto = false; alvo.checado = false; salvar(); refazCard(k);
          const c = cardEl(k); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          alvo.checado = true; salvar(); refazCard(k);
          const g = cardEl(k).querySelector('.gentil:not([hidden])') || cardEl(k).querySelector('.field.invalid');
          if (g) g.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
    });
    document.getElementById('add').onclick = () => {
      fechaOutros(-1);
      S.pessoas.push(novaPessoa()); salvar(); refazLista();
      const p = S.pessoas[S.pessoas.length - 1];
      const c = cardEl(S.pessoas.length - 1); if (c) c.scrollIntoView({ block: 'start' });
      const n = document.getElementById('pn-' + p.id); if (n) n.focus({ preventScroll: true });
    };
    document.getElementById('voltar').onclick = () => { S.tela = 'dados'; render(); };
    document.getElementById('gerar').onclick = () => {
      let pess = S.pessoas.filter(p => !vazia(p));
      const inc = pess.filter(p => !completa(p));
      inc.forEach(p => { p.checado = true; p.aberto = true; });
      const nOk = pess.length - inc.length;
      const ferr = document.getElementById('ferr');
      if (inc.length || nOk < 2) {
        if (pess.length < 2) { pess.forEach(p => { if (completa(p)) p.aberto = false; }); pess.push(novaPessoa()); }
        S.pessoas = pess; salvar(); refazLista();
        ferr.textContent = inc.length
          ? `${inc.length === 1 ? 'Uma pessoa ainda tem' : inc.length + ' pessoas ainda têm'} quadrantes com menos de ${CONFIG.min} itens ou sem nome. Complete ou remova quem não vai entrar na análise.`
          : 'Adicione pelo menos 2 pessoas para o relatório comparar o time.';
        ferr.hidden = false;
        const alvo = lista.querySelector('.pessoa.incomplete') || lista.querySelector('.pessoa.open');
        if (alvo) alvo.scrollIntoView({ block: 'start', behavior: 'smooth' });
        return;
      }
      pess.forEach(p => { p.aberto = false; p.checado = false; });
      S.pessoas = pess; S.tela = 'resultado'; S.data = new Date().toISOString(); S.enviado = false; salvar(); render();
    };
  }

  // ------------------------------------------------------------ análise
  function analisar() {
    const P = S.pessoas.filter(completa), N = P.length;
    const T = { f: {}, w: {}, o: {}, t: {} };
    P.forEach((p, pi) => QUADS.forEach(({ k }) => itens(p, k).forEach(txt => {
      const th = tema(txt, k);
      const m = T[k][th.key] || (T[k][th.key] = { key: th.key, rot: th.rot, def: th.def, pessoas: [], itens: {} });
      if (!m.pessoas.includes(pi)) m.pessoas.push(pi);
      (m.itens[pi] = m.itens[pi] || []).push(txt);
    })));
    const lista = k => Object.values(T[k]).sort((a, b) => b.pessoas.length - a.pessoas.length);
    const nomes = idx => ejunta(idx.map(i => P[i].nome.trim()));
    const mentoresDe = (wkey, exceto = []) => (T.f[wkey] ? T.f[wkey].pessoas.filter(x => !exceto.includes(x)) : []);

    // duplas de aprendizado
    const carga = {}, duplas = [];
    P.forEach((p, pi) => {
      const vistos = new Set(); let c = 0;
      for (const txt of itens(p, 'w')) {
        const th = tema(txt, 'w'); if (vistos.has(th.key)) continue; vistos.add(th.key);
        const cands = mentoresDe(th.key, [pi]); if (!cands.length) continue;
        const m = cands.slice().sort((a, b) => (carga[a] || 0) - (carga[b] || 0) || a - b)[0];
        carga[m] = (carga[m] || 0) + 1;
        duplas.push({ a: pi, m, rot: th.rot, txtW: txt, txtF: T.f[th.key].itens[m][0] });
        if (++c >= CONFIG.duplasPorPessoa) break;
      }
    });

    // pontos de atenção
    const cands = [];
    lista('t').forEach(tt => {
      const links = tt.key.startsWith('c:') ? [tt.key] : (RISCO[tt.key] || []);
      links.forEach(wk => {
        const ww = T.w[wk]; if (!ww) return;
        const ambos = tt.pessoas.filter(x => ww.pessoas.includes(x));
        cands.push({ tipo: 'combo', tt, ww, ambos, score: tt.pessoas.length + ww.pessoas.length + ambos.length + 1 });
      });
    });
    cands.sort((a, b) => b.score - a.score);
    const usadosT = new Set(), usadosW = new Set(), pontos = [];
    cands.forEach(c => {
      if (pontos.length >= 2 || usadosT.has(c.tt.key) || usadosW.has(c.ww.key)) return;
      usadosT.add(c.tt.key); usadosW.add(c.ww.key);
      const prot = c.tt.def && c.tt.def.proteger ? c.tt.def.proteger : (c.ww.def ? c.ww.def.melhorar : PROTEGER_GERAL);
      let texto = `${c.tt.rot} aparece como ameaça para ${nomes(c.tt.pessoas)}, e ${c.ww.rot.toLowerCase()} é uma fraqueza de ${nomes(c.ww.pessoas)}. Quando as duas se encontram, o desempenho tende a cair justamente na hora mais difícil.`;
      if (c.ambos.length) texto += ` Atenção especial a ${nomes(c.ambos)}, que ${c.ambos.length === 1 ? 'tem' : 'têm'} as duas.`;
      pontos.push({ tag: 'Ameaça + fraqueza', combo: true, score: c.score + 2, titulo: `${c.tt.rot} × ${c.ww.rot}`, texto, faz: prot });
    });
    lista('w').forEach(ww => {
      if (usadosW.has(ww.key)) return;
      const n = ww.pessoas.length, ment = mentoresDe(ww.key, ww.pessoas);
      const melh = ww.def ? ww.def.melhorar : MELHORAR_GERAL;
      if (n >= 2) {
        let texto = `Aparece em ${n} de ${N} pessoas (${nomes(ww.pessoas)}). Uma fraqueza compartilhada pesa no time inteiro, não só em cada pessoa.`;
        texto += ment.length ? ` ${nomes(ment)} ${ment.length === 1 ? 'tem' : 'têm'} isso como força e ${ment.length === 1 ? 'pode' : 'podem'} ajudar.` : ' Ninguém do time tem isso como força: vale buscar capacitação de fora.';
        pontos.push({ tag: 'Fraqueza do grupo', score: n + (ment.length ? 0 : 1), titulo: ww.rot, texto, faz: melh });
      } else if (!ment.length) {
        pontos.push({ tag: 'Sem quem ensine no time', score: 1, titulo: ww.rot,
          texto: `${nomes(ww.pessoas)} tem essa fraqueza e ninguém do time tem isso como força. Sem uma referência interna, a evolução depende de apoio de fora.`,
          faz: melh + ' Um curso ou uma mentoria externa podem acelerar.' });
      }
    });
    lista('t').forEach(tt => {
      if (usadosT.has(tt.key) || tt.pessoas.length < 2) return;
      pontos.push({ tag: 'Ameaça recorrente', score: tt.pessoas.length, titulo: tt.rot,
        texto: `Aparece para ${tt.pessoas.length} de ${N} pessoas (${nomes(tt.pessoas)}). Quando a mesma ameaça pesa sobre várias pessoas, ela deixa de ser individual e vira um risco do time.`,
        faz: tt.def && tt.def.proteger ? tt.def.proteger : PROTEGER_GERAL });
    });
    pontos.sort((a, b) => b.score - a.score);
    if (!pontos.length) {
      const ww = lista('w')[0];
      if (ww) pontos.push({ tag: 'Fraqueza para acompanhar', score: 1, titulo: ww.rot, texto: `Aparece para ${nomes(ww.pessoas)}.`, faz: ww.def ? ww.def.melhorar : MELHORAR_GERAL });
    }
    return { P, N, T, lista, nomes, duplas, pontos: pontos.slice(0, 4) };
  }

  // ------------------------------------------------------------ resultado
  function barras(A, k) {
    const L = A.lista(k).slice(0, 6);
    if (!L.length) return '<p class="vazio">Nada para mostrar.</p>';
    return `<div class="freq">${L.map(t => `<div class="f q-${k}"><span>${esc(t.rot)}</span><div class="track"><div class="fill" style="width:${Math.max(6, t.pessoas.length / A.N * 100)}%"></div></div><b>${t.pessoas.length}/${A.N}</b>
      <span class="nm">${esc(A.nomes(t.pessoas))}</span></div>`).join('')}</div>`;
  }
  function destaque(A, k) {
    const L = A.lista(k), top = L[0], quadro = Q[k];
    const rot = k === 'f' ? 'A força que mais aparece' : 'A fraqueza que mais aparece';
    if (!top) return '';
    if (top.pessoas.length < 2) {
      return `<div class="big q-${k}"><div class="k">${rot}</div><div class="v">${k === 'f' ? 'Forças variadas' : 'Fraquezas variadas'}</div>
        <p class="leit">${k === 'f' ? 'Nenhuma força se repete entre as pessoas. Isso é bom: cada um tem algo diferente para ensinar ao time.' : 'Nenhuma fraqueza se repete entre as pessoas. O desenvolvimento pode ser individual, pessoa a pessoa.'}</p></div>`;
    }
    const empate = L.filter(t => t !== top && t.pessoas.length === top.pessoas.length).map(t => t.rot);
    const leit = top.def ? (k === 'f' ? top.def.usar : top.def.melhorar) : (k === 'f' ? 'Essa é uma marca do time. Use-a de propósito nos projetos mais importantes.' : MELHORAR_GERAL);
    return `<div class="big q-${k}"><div class="k">${rot}</div><div class="v">${esc(top.rot)}</div>
      <p class="quem">${top.pessoas.length} de ${A.N} pessoas: ${esc(A.nomes(top.pessoas))}${empate.length ? `. Empatada com ${esc(ejunta(empate))}` : ''}.</p>
      <p class="leit">${esc(leit)}</p></div>`;
  }
  function chipsAoRedor(A, k) {
    const L = A.lista(k).slice(0, 6);
    return `<div class="chipline">${L.map(t => `<span class="tagq q-${k}">${esc(t.rot)} <b>${t.pessoas.length}</b></span>`).join('')}</div>`;
  }

  function telaResultado() {
    const A = analisar();
    if (A.N < 2) { S.tela = 'time'; salvar(); render(); return; }
    const quando = S.data ? dataBR(new Date(S.data)) : dataBR(new Date());
    const totalItens = A.P.reduce((s, p) => s + QUADS.reduce((t, q) => t + itens(p, q.k).length, 0), 0);
    const d = S.dados;
    const titulo = d.time ? `SWOT do time ${d.time}` : 'O SWOT do seu time';

    const pontos = A.pontos.map(p => `<div class="ponto"><span class="tag ${p.combo ? 'combo' : ''}">${esc(p.tag)}</span><h3>${esc(p.titulo)}</h3><p>${esc(p.texto)}</p>
      <div class="faz"><b>O que fazer</b>${esc(p.faz)}</div></div>`).join('');

    const duplas = A.duplas.length ? A.duplas.map(x => `<div class="dupla">
        <div class="pess"><div class="k">Aprende</div><div class="nome">${esc(A.P[x.a].nome)}</div><small>Fraqueza: “${esc(x.txtW)}”</small></div>
        <div class="tema">${esc(x.rot)}</div>
        <div class="pess m"><div class="k">Ensina</div><div class="nome">${esc(A.P[x.m].nome)}</div><small>Força: “${esc(x.txtF)}”</small></div>
      </div>`).join('')
      : '<p class="vazio">Nenhuma fraqueza encontrou par entre as forças do time. Os pontos de atenção acima mostram onde vale buscar apoio de fora.</p>';

    const topO = A.lista('o')[0], topT = A.lista('t')[0];
    const maps = A.P.map(p => `<div class="map"><h3>${esc(p.nome)}</h3>${p.funcao.trim() ? `<p class="fn">${esc(p.funcao)}</p>` : ''}
      <div class="mgrid">${QUADS.map(q => `<div class="mq q-${q.k}"><div class="k">${q.nome}</div><ul>${itens(p, q.k).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div></div>`).join('');

    app.innerHTML = `<div class="shell wide fade">${topo('<span class="meta">SWOT do Time</span>')}
      <header class="res-head"><p class="who">${esc(d.nome)}${d.cargo ? ', ' + esc(d.cargo) : ''}${d.empresa ? ' · ' + esc(d.empresa) : ''} · ${quando}</p>
        <h1>${esc(titulo)}</h1>
        <p class="sum">${A.N} pessoas analisadas, ${totalItens} itens no total${A.duplas.length ? ` e ${A.duplas.length} ${A.duplas.length === 1 ? 'dupla' : 'duplas'} de aprendizado sugeridas` : ''}.</p></header>

      <div class="hero-res">${destaque(A, 'f')}${destaque(A, 'w')}</div>

      <section class="section"><h2>O que mais se repete no grupo</h2>
        <p class="sub">Respostas parecidas foram agrupadas pelo tema, mesmo quando escritas com palavras diferentes. A barra mostra quantas pessoas do time têm aquele tema.</p>
        <div class="grid2">
          <div class="pcard q-f"><div class="k">Forças do grupo</div>${barras(A, 'f')}</div>
          <div class="pcard q-w"><div class="k">Fraquezas do grupo</div>${barras(A, 'w')}</div>
        </div>
      </section>

      <section class="section"><h2>O que pode realmente atrapalhar</h2>
        <p class="sub">Fraquezas que se repetem, ameaças que pesam sobre várias pessoas e, principalmente, os pontos em que uma ameaça encontra uma fraqueza do time.</p>
        <div class="pontos">${pontos}</div>
      </section>

      <section class="section"><h2>Quem pode aprender com quem</h2>
        <p class="sub">Duplas formadas quando a fraqueza de uma pessoa é a força de outra. Até ${CONFIG.duplasPorPessoa} duplas por pessoa, distribuindo quem ensina para ninguém ficar sobrecarregado.</p>
        <div class="duplas">${duplas}</div>
        ${A.duplas.length ? `<div class="pcard comofaz"><div class="k">Como fazer as duplas funcionarem</div><ul>
          <li>Encontros de 30 minutos a cada 15 dias, durante 90 dias.</li>
          <li>Quem aprende escolhe o assunto de cada encontro e leva uma situação real.</li>
          <li>Reconheça em público quem ensina: ensinar também é desenvolvimento.</li></ul></div>` : ''}
      </section>

      <section class="section"><h2>O que está ao redor do time</h2>
        <div class="grid2">
          <div class="pcard q-o"><div class="k">Oportunidades mais citadas</div>${chipsAoRedor(A, 'o')}
            ${topO ? `<p class="leit"><b>Para aproveitar:</b> ${esc(topO.def && topO.def.aproveitar ? topO.def.aproveitar : 'Converse com o time sobre como transformar essa oportunidade em um plano com dono e prazo.')}</p>` : ''}</div>
          <div class="pcard q-t"><div class="k">Ameaças mais citadas</div>${chipsAoRedor(A, 't')}
            ${topT ? `<p class="leit"><b>Para se proteger:</b> ${esc(topT.def && topT.def.proteger ? topT.def.proteger : PROTEGER_GERAL)}</p>` : ''}</div>
        </div>
      </section>

      <section class="section"><h2>O SWOT de cada pessoa</h2><div class="maps">${maps}</div></section>

      <div class="actions no-print" style="margin-top:34px">
        <button class="btn btn-primary" id="enviar">Enviar relatório para a Mentorei</button>
        <button class="btn btn-ghost" id="pdf">Baixar em PDF</button>
      </div>
      <p class="status" id="status"></p>

      <div class="reflect"><h2>Para conversar com o time</h2><ul>
        <li>Que força deste time ainda não está sendo usada de propósito?</li>
        <li>Qual fraqueza do grupo nasce do jeito como o trabalho está organizado, e não das pessoas?</li>
        <li>Quais duplas de aprendizado podem começar já nesta semana?</li></ul></div>
      <p class="note">Refaça esta análise em 90 dias, com as mesmas pessoas. O que mudar nos quadrantes mostra o efeito das duplas e dos combinados.</p>
      <div class="foot"><span>Mentorei · contato@mentorei.com.br</span><span class="no-print"><button class="btn-link" id="editar">Editar respostas</button> &nbsp; <button class="btn-link" id="refazer">Começar de novo</button></span></div>
    </div>`;
    const st = document.getElementById('status');
    document.getElementById('pdf').onclick = () => {
      if (emPrevia()) { st.textContent = 'Prévia: na versão publicada, este botão abre a janela para salvar o relatório em PDF.'; st.className = 'status ok'; return; }
      window.print();
    };
    document.getElementById('enviar').onclick = () => enviar('relatório enviado pelo líder', true);
    document.getElementById('editar').onclick = () => { S.tela = 'time'; salvar(); render(); };
    document.getElementById('refazer').onclick = e => {
      const b = e.currentTarget;
      if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = 'Clique de novo para apagar tudo'; setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = 'Começar de novo'; } }, 5000); return; }
      S = novoEstado(); salvar(); render();
    };
    if (!S.enviado) enviar('resultado automático', false);
  }

  function pacote(origem) {
    const A = analisar();
    const freq = k => A.lista(k).slice(0, 6).map(t => `${t.rot} (${t.pessoas.length}/${A.N}: ${A.nomes(t.pessoas)})`).join('\n');
    return { 'form-name': CONFIG.nomeFormulario, 'bot-field': '', origem,
      nome: S.dados.nome, email: S.dados.email, whatsapp: S.dados.whatsapp, cargo: S.dados.cargo, empresa: S.dados.empresa, time: S.dados.time,
      consentimento: S.dados.consentimento ? 'sim' : 'não', colaboradores: String(A.N),
      forcas_frequentes: freq('f'), fraquezas_frequentes: freq('w'),
      pontos_de_atencao: A.pontos.map(p => `${p.tag}: ${p.titulo} | ${p.texto} | O que fazer: ${p.faz}`).join('\n'),
      duplas: A.duplas.map(x => `${A.P[x.a].nome} aprende ${x.rot} com ${A.P[x.m].nome}`).join('\n'),
      swot_individual: A.P.map(p => `${p.nome}${p.funcao.trim() ? ' (' + p.funcao.trim() + ')' : ''}\n` + QUADS.map(q => `  ${q.nome}: ${itens(p, q.k).join('; ')}`).join('\n')).join('\n\n'),
      data: S.data ? dataBR(new Date(S.data)) : dataBR(new Date()) };
  }

  async function enviar(origem, manual) {
    const st = document.getElementById('status');
    const msg = (t, cls) => { if (st) { st.textContent = t; st.className = 'status ' + (cls || ''); } };
    if (naPlataforma) {
      window.parent.postMessage({ tipo: 'mentorei-resultado', manual, pacote: pacote(origem) }, location.origin);
      S.enviado = true; salvar();
      if (manual) msg('Relatório guardado na sua área da plataforma. Seu mentor já pode ver.', 'ok');
      return;
    }
    if (emPrevia()) { S.enviado = true; salvar(); if (manual) msg('Prévia: na versão publicada, o relatório será enviado para a Mentorei neste momento.', 'ok'); return; }
    if (manual) msg('Enviando…');
    try {
      const r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(pacote(origem)).toString() });
      if (!r.ok) throw new Error(r.status);
      S.enviado = true; salvar(); if (manual) msg('Relatório enviado. A Mentorei recebeu uma cópia.', 'ok');
    } catch (e) { if (manual) msg('Não foi possível enviar agora. Verifique a internet e tente de novo.', 'err'); }
  }

  function render() {
    ({ abertura: telaAbertura, dados: telaDados, time: telaTime, resultado: telaResultado }[S.tela] || telaAbertura)();
    window.scrollTo({ top: 0 });
  }
  render();
})();
</script>
</body>
</html>
