<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23091216%27/%3E%3Cpath d=%27M20 18l14 14-14 14M32 18l14 14-14 14%27 fill=%27none%27 stroke=%27%23C8F04A%27 stroke-width=%276%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<title>Roda do Profissional do Futuro</title>
<meta name="description" content="Autoavaliação TraçãoCoop · Mentorei">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: cada tela abre com uma faixa escura da marca TraçãoCoop (número da parte em verde-lima, como nos slides)
   e segue com uma coluna única de até 880px em cartões brancos sobre fundo "papel". Visual único (claro + faixas escuras), por escolha da marca. */
:root{
  --ink:#091216;      /* preto profundo do deck */
  --ink-2:#14222B;    /* cartões sobre faixa escura */
  --ink-3:#22343F;    /* linhas sobre escuro */
  --lime:#C8F04A;     /* verde-lima TraçãoCoop */
  --lime-2:#9CC42C;   /* lima mais fechado (foco, traços) */
  --paper:#F3F5F4;    /* fundo claro dos slides */
  --white:#FFFFFF;
  --line:#E0E1E1;
  --grey:#5E6467;     /* texto de apoio do deck */
  --grey-2:#8C9396;
  --coral:#E8604C;    /* atenção (usado no deck em "OH-OH" e "ERRAR") */
  --p1:#C8F04A; --p2:#8FB82A; --p3:#5E6467; --p4:#091216;
  --font:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.125rem; --fs-xl:1.5rem; --fs-2xl:clamp(1.75rem,5vw,2.5rem); --fs-3xl:clamp(2.25rem,8vw,3.5rem);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --thumb:30px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-md);line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- faixa superior com as logos ---------- */
.topbar{background:var(--ink)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.topbar img.mentorei{height:15px;width:auto}
.topbar img.tracao{height:22px;width:auto}

/* ---------- faixa escura de abertura ---------- */
.band{background:radial-gradient(120% 140% at 100% 0%,#1F3418 0%,rgba(31,52,24,0) 55%),var(--ink);color:var(--white)}
.band .wrap{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tag-lime{background:var(--lime);color:var(--ink)}
.tag-line{border:1px solid var(--lime);color:var(--lime)}
.band h1{font-size:var(--fs-2xl)}
.band .lead{color:#D3D9DB;max-width:62ch;font-size:var(--fs-md)}
.band .lead b{color:var(--white)}

/* prévia dos pilares na abertura */
.pillars{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pillars li{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pillars small{color:var(--lime);font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pillars span{font-weight:600;font-size:var(--fs-sm);line-height:1.3}

/* progresso das 4 partes */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;gap:6px;min-width:0}
.step i{display:block;height:6px;border-radius:99px;background:var(--ink-3)}
.step span{font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done i{background:var(--lime)}
.step.done span{color:var(--lime)}
.step.now i{background:linear-gradient(90deg,var(--lime) 0 45%,var(--ink-3) 45%)}
.step.now span{color:var(--white)}

.parte-head{display:flex;align-items:center;gap:18px}
.parte-num{font-size:clamp(4rem,16vw,6rem);font-weight:800;line-height:.8;color:var(--lime);letter-spacing:-.04em}
.parte-head .eyebrow{display:block;color:var(--lime);font-size:var(--fs-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}

.legend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:var(--fs-sm);color:#D3D9DB;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r-md);padding:10px 14px}
.legend b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:99px;background:var(--lime);color:var(--ink);font-size:var(--fs-xs);margin-right:6px}

/* ---------- conteúdo claro ---------- */
.content{display:flex;flex-direction:column;gap:16px;padding-block:24px 40px}
.card{background:var(--white);border-radius:var(--r-lg);padding:22px;box-shadow:0 1px 2px rgba(9,18,22,.05),0 8px 24px rgba(9,18,22,.05)}
.card h2{font-size:var(--fs-xl)}
.muted{color:var(--grey)}
.fine{font-size:var(--fs-xs);color:var(--grey)}

/* formulário */
.form{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:var(--fs-sm);font-weight:600}
.field input{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--white);font-size:var(--fs-md);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(200,240,74,.6)}
.field.err input{border-color:var(--coral)}
.field .msg{font-size:var(--fs-xs);color:#B4402F;min-height:0}

.howto{display:grid;gap:12px;padding:20px 22px;border-radius:var(--r-lg);background:transparent;border:1.5px dashed #CFD4D3}
.howto h3{font-size:var(--fs-md)}
.howto ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:h}
.howto li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:var(--fs-sm);color:var(--grey);counter-increment:h}
.howto li::before{content:counter(h);display:grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--lime);font-weight:700;font-size:var(--fs-xs)}

/* botões */
.privacy{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--paper);border-radius:var(--r-md);padding:16px 18px}
.privacy .lock{width:40px;height:40px;border-radius:99px;background:var(--ink);display:grid;place-items:center}
.privacy-txt{display:flex;flex-direction:column;gap:6px}
.privacy h3{font-size:var(--fs-md)}
.privacy p{font-size:var(--fs-sm);color:var(--ink)}
.privacy p.fine{color:var(--grey);font-size:var(--fs-xs)}
.btn{appearance:none;border:0;border-radius:99px;padding:14px 26px;white-space:nowrap;font-weight:700;font-size:var(--fs-md);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,background .15s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.link:focus-visible,.tick:focus-visible{outline:3px solid var(--lime-2);outline-offset:3px}
.btn-primary{background:var(--lime);color:var(--ink)}
.btn-primary:hover{background:#D4F66A}
.btn-primary[disabled]{background:#DDE2E0;color:#8C9396;cursor:not-allowed}
.btn-dark{background:var(--ink);color:var(--white)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-coral{background:var(--coral);color:var(--white)}
.link{appearance:none;background:none;border:0;padding:4px 0;color:var(--grey);font-size:var(--fs-sm);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center}

.notice{border-radius:var(--r-md);padding:14px 16px;font-size:var(--fs-sm);display:flex;gap:10px;align-items:flex-start}
.notice-lime{background:#EEF9CF;color:var(--ink)}
.notice-dark{background:var(--ink);color:var(--white)}
.notice-dark b{color:var(--lime)}

/* perguntas */
.q{display:flex;flex-direction:column;gap:18px}
.q-top{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.q-n{display:grid;place-items:center;width:34px;height:34px;border-radius:99px;background:var(--paper);font-weight:700;font-size:var(--fs-sm);transition:background .2s}
.q.ok .q-n{background:var(--lime)}
.q-text{font-size:var(--fs-lg);font-weight:500;line-height:1.45;padding-top:3px}
.q-scale{display:flex;flex-direction:column;gap:10px}
.q-val{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.q-val .hint{font-size:var(--fs-xs);color:var(--grey);font-weight:500}
.q-val .v{font-size:1.75rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.q-val .v small{font-size:var(--fs-sm);font-weight:600;color:var(--grey-2)}
.q:not(.ok) .q-val .v{color:#C3C8C7}

.range{-webkit-appearance:none;appearance:none;display:block;height:12px;border-radius:99px;margin:8px 0 4px;cursor:pointer;touch-action:pan-y;
  width:calc(90% + var(--thumb));margin-left:calc(5% - var(--thumb) / 2);
  background:linear-gradient(to right,var(--lime) 0 calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--f,0)),var(--line) 0)}
.range.pristine{background:var(--line)}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--thumb);height:var(--thumb);border-radius:50%;background:var(--ink);border:5px solid var(--white);box-shadow:0 0 0 2px var(--ink),0 3px 8px rgba(9,18,22,.25)}
.range::-moz-range-thumb{width:var(--thumb);height:var(--thumb);border-radius:50%;background:var(--ink);border:5px solid var(--white);box-shadow:0 0 0 2px var(--ink),0 3px 8px rgba(9,18,22,.25);box-sizing:border-box}
.range::-moz-range-track{background:transparent;height:12px}
.range.pristine::-webkit-slider-thumb{background:var(--white);border:2px dashed var(--grey-2);box-shadow:none}
.range.pristine::-moz-range-thumb{background:var(--white);border:2px dashed var(--grey-2);box-shadow:none}
.range:focus{outline:none}
.range:focus-visible{outline:3px solid var(--lime-2);outline-offset:8px}

.ticks{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0}
.tick{appearance:none;border:0;background:none;padding:6px 0;font-size:var(--fs-sm);font-weight:600;color:var(--grey-2);cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums}
.tick:hover{color:var(--ink);background:var(--paper)}
.tick.on{color:var(--ink);background:var(--lime)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-xs);color:var(--grey)}

.sendbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--white);border-radius:var(--r-lg);padding:12px 12px 12px 20px;box-shadow:0 12px 30px rgba(9,18,22,.25)}
.sendbar .count{font-size:var(--fs-sm);color:#D3D9DB}
.sendbar .count b{color:var(--lime);font-size:var(--fs-md)}

/* intervalo */
.check{width:64px;height:64px;border-radius:99px;background:var(--lime);display:grid;place-items:center}
.next{display:flex;flex-direction:column;gap:14px}
.next .eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}

/* ---------- resultado ---------- */
.score-hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score-hero .big{font-size:var(--fs-3xl);font-weight:800;line-height:.85;color:var(--lime);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.score-hero .cap{color:#D3D9DB;font-size:var(--fs-sm);padding-bottom:4px}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ptile{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ptile small{color:var(--lime);font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ptile span{font-size:var(--fs-sm);font-weight:600;line-height:1.25;min-height:2.5em}
.ptile strong{font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums}
.ptile .bar{height:5px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.ptile .bar i{display:block;height:100%;background:var(--lime);border-radius:99px}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:var(--fs-xl)}

.radar-box{width:100%;overflow:hidden}
.radar-box svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto}

.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:6px}
.pgroup{display:flex;flex-direction:column;gap:8px;min-width:0}
.pgroup h3{font-size:var(--fs-sm);display:flex;align-items:center;gap:8px;justify-content:space-between}
.pgroup h3 .dot{width:12px;height:12px;border-radius:4px;flex:none}
.pgroup h3 .nm{flex:1;min-width:0}
.pgroup h3 .avg{font-variant-numeric:tabular-nums;color:var(--grey)}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) 64px 34px;align-items:center;gap:8px;font-size:var(--fs-sm)}
.srow .ix{display:grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--white);font-size:.6875rem;font-weight:700}
.srow .ix.best{background:var(--lime);color:var(--ink)}
.srow .ix.worst{background:var(--coral)}
.srow .nm{line-height:1.25}
.srow .bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:99px}
.srow .sc{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lvl-alta{background:var(--lime)}
.lvl-media{background:var(--ink)}
.lvl-baixa{background:var(--coral)}
.keyline{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--grey);margin-top:4px}
.keyline span{display:inline-flex;align-items:center;gap:6px}
.keyline i{width:12px;height:8px;border-radius:99px;display:inline-block}

.highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hl{border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hl small{font-size:var(--fs-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hl h3{font-size:var(--fs-xl)}
.hl .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hl .num{font-size:2.75rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hl .pill{font-size:var(--fs-xs);font-weight:600;padding:4px 10px;border-radius:99px}
.hl-best{background:var(--lime);color:var(--ink)}
.hl-best .pill{background:var(--ink);color:var(--lime)}
.hl-worst{background:var(--ink);color:var(--white)}
.hl-worst small{color:var(--coral)}
.hl-worst .num{color:var(--white)}
.hl-worst .pill{background:var(--coral);color:var(--white)}
.hl p{font-size:var(--fs-sm)}
.hl-worst p{color:#D3D9DB}

.plan{display:flex;flex-direction:column;gap:18px}
.plan .why{border-left:0;background:var(--paper);border-radius:var(--r-md);padding:16px 18px;font-size:var(--fs-md);font-style:italic;color:var(--ink)}
.actions{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.action{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:14px;border:1.5px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:border-color .15s,background .15s}
.action:hover{border-color:#C9CFCD}
.action input{position:absolute;opacity:0;width:1px;height:1px}
.action .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--white)}
.action .box svg{opacity:0}
.action input:checked + .box{background:var(--lime);border-color:var(--ink)}
.action input:checked + .box svg{opacity:1}
.action input:focus-visible + .box{outline:3px solid var(--lime-2);outline-offset:2px}
.action .when{display:inline-block;font-size:.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:2px}
.action .txt{font-size:var(--fs-md);line-height:1.45}
.action.done{background:#F7FBEA;border-color:var(--lime-2)}
.commit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;padding:18px;border-radius:var(--r-md);background:var(--ink);color:var(--white)}
.commit h3{grid-column:1/-1;font-size:var(--fs-md)}
.commit h3 span{color:var(--lime)}
.commit .field label{color:#D3D9DB}
.commit .field input{border-color:var(--ink-3);background:var(--ink-2);color:var(--white)}
.commit .field input:focus{border-color:var(--lime)}
.watch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--fs-sm)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--paper);font-weight:600;font-size:var(--fs-sm)}
.chip b{font-variant-numeric:tabular-nums}

.endbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.endbar .btns{display:flex;gap:10px;flex-wrap:wrap}
.status{font-size:var(--fs-sm);color:var(--grey);display:flex;align-items:center;gap:8px}
.status .dot{width:9px;height:9px;border-radius:99px;background:var(--grey-2);flex:none}
.status.ok .dot{background:var(--lime-2)}
.status.err .dot{background:var(--coral)}
.confirm{display:flex;flex-direction:column;gap:12px}
.confirm .btns{display:flex;gap:10px;flex-wrap:wrap}

.example-flag{background:var(--coral);color:var(--white)}
.example-flag .wrap{padding-block:10px;font-size:var(--fs-sm);font-weight:600;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.example-flag button{background:var(--white);color:var(--ink);padding:8px 16px;font-size:var(--fs-sm)}

.foot{padding-block:8px 32px;text-align:center;font-size:var(--fs-xs);color:var(--grey)}

@media (max-width:640px){
  .fields,.plist,.highlights,.commit{grid-template-columns:minmax(0,1fr)}
  .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:18px}
  .pillars{grid-template-columns:minmax(0,1fr);gap:8px}
  .pillars li{flex-direction:row;align-items:baseline;gap:12px;padding:10px 14px}
  .pillars small{flex:none;width:66px;white-space:nowrap}
  .parte-head{gap:14px}
  .parte-head h1{font-size:clamp(1.3rem,5.4vw,2.5rem)}
  .parte-num{font-size:4.25rem}
  .q-text{font-size:var(--fs-md)}
  .sendbar .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  :root{background:var(--white)}
  body{background:var(--white);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .card,.hl,.ptile,.pgroup,.action,.commit{break-inside:avoid}
  .band .wrap{padding-block:18px 24px}
  .content{padding-block:16px}
  .card{box-shadow:none;border:1px solid var(--line)}
}
</style>

/* ===================== CÁLCULOS ===================== */
function media(a){ if (!a.length) return 0; var s=0; for (var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
function r1(v){ return Math.round(v*10)/10; }
function fmt(v){ return r1(v).toFixed(1).replace(".", ","); }
function nivel(v){ return v < 5 ? "baixa" : (v < 8 ? "media" : "alta"); }
function rotuloNivel(v){ return v < 5 ? "Precisa de atenção" : (v < 8 ? "Em desenvolvimento" : "Ponto forte"); }

function calcular(resp){
  var porHab = {}; HAB.forEach(function(h){ porHab[h.id] = []; });
  var porParte = {}, todas = [];
  PARTES.forEach(function(P){
    var r = resp[P.n] || [];
    porParte[P.n] = r1(media(r));
    P.perguntas.forEach(function(q,i){ if (r[i] != null){ porHab[q.h].push(r[i]); todas.push(r[i]); } });
  });
  var hab = HAB.map(function(h){ return {id:h.id, p:h.p, nome:h.nome, curto:h.curto, v:r1(media(porHab[h.id]))}; });
  var max = Math.max.apply(null, hab.map(function(h){return h.v;}));
  var min = Math.min.apply(null, hab.map(function(h){return h.v;}));
  var best = hab.filter(function(h){return h.v===max;});
  var worstAll = hab.filter(function(h){return h.v===min;});
  // desempate da menor nota: a da parte com menor média
  var worst = worstAll.slice().sort(function(a,b){ return porParte[a.p]-porParte[b.p]; })[0];
  // desempate da maior nota: a da parte com maior média
  var bestOne = best.slice().sort(function(a,b){ return porParte[b.p]-porParte[a.p]; })[0];
  var atencao = hab.filter(function(h){ return h.id!==worst.id && h.v < 7; }).sort(function(a,b){return a.v-b.v;});
  return {hab:hab, porParte:porParte, geral:r1(media(todas)), best:bestOne, bestEmpate:best.filter(function(h){return h.id!==bestOne.id;}),
          worst:worst, worstEmpate:worstAll.filter(function(h){return h.id!==worst.id;}), iguais:max===min, atencao:atencao};
}

function radarSVG(c, modo){
  var R = 170, N = 12;
  function ang(i){ return (-90 + i*30) * Math.PI/180; }
  function pt(i, r){ return [Math.cos(ang(i))*r, Math.sin(ang(i))*r]; }
  function f(n){ return Math.round(n*10)/10; }
  var vb = modo === "nomes" ? "-385 -268 770 536" : "-238 -238 476 476";
  var s = '<svg viewBox="'+vb+'" role="img" aria-label="Roda com as notas das 12 habilidades" font-family="Poppins, Segoe UI, Arial, sans-serif">';
  // anéis 2..10
  [2,4,6,8,10].forEach(function(v){
    var pts = []; for (var i=0;i<N;i++){ var p = pt(i, v/10*R); pts.push(f(p[0])+","+f(p[1])); }
    s += '<polygon points="'+pts.join(" ")+'" fill="'+(v===10?'#FFFFFF':'none')+'" stroke="#E0E1E1" stroke-width="1"/>';
  });
  for (var i=0;i<N;i++){ var p = pt(i,R); s += '<line x1="0" y1="0" x2="'+f(p[0])+'" y2="'+f(p[1])+'" stroke="#E0E1E1" stroke-width="1"/>'; }
  // arcos das partes
  var cores = ["#C8F04A","#8FB82A","#5E6467","#091216"];
  for (var k=0;k<4;k++){
    var a0 = (-90 + (3*k)*30 - 13) * Math.PI/180, a1 = (-90 + (3*k+2)*30 + 13) * Math.PI/180, rr = R+12;
    s += '<path d="M'+f(Math.cos(a0)*rr)+' '+f(Math.sin(a0)*rr)+' A'+rr+' '+rr+' 0 0 1 '+f(Math.cos(a1)*rr)+' '+f(Math.sin(a1)*rr)+'" fill="none" stroke="'+cores[k]+'" stroke-width="7" stroke-linecap="round"/>';
  }
  // escala
  [2,4,6,8,10].forEach(function(v){ s += '<text x="5" y="'+f(-v/10*R+11)+'" font-size="9" fill="#8C9396">'+v+'</text>'; });
  // polígono das notas
  var poly = c.hab.map(function(h,i){ var p = pt(i, h.v/10*R); return f(p[0])+","+f(p[1]); }).join(" ");
  s += '<polygon points="'+poly+'" fill="#C8F04A" fill-opacity=".55" stroke="#091216" stroke-width="2.5" stroke-linejoin="round"/>';
  c.hab.forEach(function(h,i){
    var p = pt(i, h.v/10*R);
    if (h.id === c.best.id) s += '<circle cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="7" fill="#C8F04A" stroke="#091216" stroke-width="2.5"/>';
    else if (h.id === c.worst.id) s += '<circle cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="7" fill="#E8604C" stroke="#FFFFFF" stroke-width="2"/>';
    else s += '<circle cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="4" fill="#091216"/>';
  });
  // rótulos
  c.hab.forEach(function(h,i){
    var corNota = h.v < 5 ? "#C7432F" : "#091216";
    if (modo === "nomes"){
      var p = pt(i, R+30), x = p[0], y = p[1];
      var anchor = x > 10 ? "start" : (x < -10 ? "end" : "middle");
      var linhas = h.curto.slice(); var nl = linhas.length + 1, lh = 15;
      var y0;
      if (Math.abs(x) <= 10){ y0 = y < 0 ? y - (nl-1)*lh : y + 10; }
      else { y0 = y - ((nl-1)*lh)/2 + 4; }
      s += '<text text-anchor="'+anchor+'" font-size="12.5" fill="#091216">';
      linhas.forEach(function(t,j){ s += '<tspan x="'+f(x)+'" y="'+f(y0 + j*lh)+'">'+esc(t)+'</tspan>'; });
      s += '<tspan x="'+f(x)+'" y="'+f(y0 + linhas.length*lh + 1)+'" font-size="14" font-weight="700" fill="'+corNota+'">'+fmt(h.v)+'</tspan></text>';
    } else {
      var q = pt(i, R+34);
      var fill = h.id===c.best.id ? "#C8F04A" : (h.id===c.worst.id ? "#E8604C" : "#091216");
      var tc = h.id===c.best.id ? "#091216" : "#FFFFFF";
      s += '<circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="15" fill="'+fill+'"/>';
      s += '<text x="'+f(q[0])+'" y="'+f(q[1]+4.5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+tc+'">'+(i+1)+'</text>';
    }
  });
  s += '</svg>';
  return s;
}
var ultimoCalc = null;
function desenharRadar(){
  var box = document.getElementById("radar"); if (!box || !ultimoCalc) return;
  var modo = box.clientWidth >= 600 ? "nomes" : "numeros";
  if (box.getAttribute("data-modo") === modo) return;
  box.setAttribute("data-modo", modo);
  box.innerHTML = radarSVG(ultimoCalc, modo);
}
var tRes; window.addEventListener("resize", function(){ clearTimeout(tRes); tRes = setTimeout(desenharRadar, 120); });

/* ===================== RENDER ===================== */
function render(topo){
  $flag.innerHTML = vendoExemplo ? '<div class="example-flag"><div class="wrap"><span>Exemplo de resultado. Estas não são as suas respostas.</span><button class="btn" type="button" data-act="sair-exemplo">Fechar exemplo</button></div></div>' : '';
  ultimoCalc = null;
  if (vendoExemplo){ var ex = telaResultado(EXEMPLO, true); $app.innerHTML = ex.html; ultimoCalc = ex.c; }
  else if (st.tela === "inicio" || !st.perfil) $app.innerHTML = telaInicio();
  else if (st.tela === "parte") $app.innerHTML = telaParte();
  else if (st.tela === "intervalo") $app.innerHTML = telaIntervalo();
  else { var res = telaResultado(st, false); $app.innerHTML = res.html; ultimoCalc = res.c; }
  if (ultimoCalc) desenharRadar();
  if (topo !== false) window.scrollTo(0,0);
}

/* ===================== INTERAÇÕES ===================== */
function marcar(i, v){
  var P = PARTES[st.parte-1];
  st.respostas[P.n][i] = v;
  salvar();
  var card = document.getElementById("q"+i); if (!card) return;
  card.classList.add("ok");
  var r = card.querySelector(".range"); r.classList.remove("pristine"); r.value = v; r.style.setProperty("--f", (v-1)/9); r.setAttribute("aria-valuetext","Nota "+v+" de 10");
  document.getElementById("v"+i).innerHTML = v + '<small> /10</small>';
  document.getElementById("hint"+i).textContent = "Sua nota";
  card.querySelectorAll(".tick").forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-v") === v); });
  var n = contar(st.respostas[P.n]);
  document.getElementById("count").innerHTML = '<b>'+n+'</b> de 5 respondidas';
  document.getElementById("btn-enviar").disabled = n < 5;
}

$app.addEventListener("input", function(e){
  var t = e.target;
  if (t.classList && t.classList.contains("range")) marcar(+t.getAttribute("data-i"), +t.value);
  if (t.id === "in-whats") t.value = mascaraFone(t.value);
  if (t.id === "cm-passo" || t.id === "cm-ate"){ st.compromisso = st.compromisso || {}; st.compromisso[t.id==="cm-passo"?"passo":"ate"] = t.value; salvar(); }
});
$app.addEventListener("change", function(e){
  var t = e.target;
  if (t.classList && t.classList.contains("range")) marcar(+t.getAttribute("data-i"), +t.value);
  if (t.hasAttribute && t.hasAttribute("data-chk")){
    if (vendoExemplo){ t.closest(".action").classList.toggle("done", t.checked); return; }
    st.checks = st.checks || {}; st.checks[t.getAttribute("data-chk")] = t.checked; salvar();
    t.closest(".action").classList.toggle("done", t.checked);
  }
});
// toque no botão da barra sem arrastar também conta como resposta
$app.addEventListener("click", function(e){
  var r = e.target.closest && e.target.closest(".range");
  if (r){ marcar(+r.getAttribute("data-i"), +r.value); return; }
  var tick = e.target.closest && e.target.closest(".tick");
  if (tick){ marcar(+tick.getAttribute("data-i"), +tick.getAttribute("data-v")); return; }
  var b = e.target.closest && e.target.closest("[data-act]");
  if (!b) return;
  acao(b.getAttribute("data-act"));
});
$app.addEventListener("keyup", function(e){
  var t = e.target; if (t.classList && t.classList.contains("range")) marcar(+t.getAttribute("data-i"), +t.value);
});
$flag.addEventListener("click", function(e){ var b = e.target.closest("[data-act]"); if (b) acao(b.getAttribute("data-act")); });

$app.addEventListener("submit", function(e){
  if (e.target.id !== "f-cadastro") return;
  e.preventDefault();
  var v = function(id){ return (document.getElementById("in-"+id).value || "").trim(); };
  var dados = {nome:v("nome"), email:v("email"), whats:v("whats"), cargo:v("cargo")};
  var erros = {};
  if (dados.nome.split(/\s+/).filter(Boolean).length < 2) erros.nome = "Escreva nome e sobrenome.";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dados.email)) erros.email = "Confira o e-mail (ex.: nome@empresa.com.br).";
  if (!EMBUTIDO && dados.whats.replace(/\D/g,"").length < 10) erros.whats = "Informe o WhatsApp com DDD.";
  if (dados.cargo.length < 2) erros.cargo = "Informe seu cargo ou área.";
  ["nome","email","whats","cargo"].forEach(function(id){
    document.getElementById("fd-"+id).classList.toggle("err", !!erros[id]);
    document.getElementById("msg-"+id).textContent = erros[id] || "";
  });
  var primeiro = Object.keys(erros)[0];
  if (primeiro){ document.getElementById("in-"+primeiro).focus(); return; }
  st.perfil = dados; st.tela = "parte"; st.parte = 1; retomou = false; st.inicioEm = agora(); st.envioContato = "pendente";
  salvar(); render(); enviarContato();
});

function mascaraFone(s){
  var d = s.replace(/\D/g,"").slice(0,11);
  if (d.length <= 2) return d.length ? "("+d : "";
  if (d.length <= 6) return "("+d.slice(0,2)+") "+d.slice(2);
  if (d.length <= 10) return "("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);
  return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
}

function agora(){
  var d = new Date(); function z(n){ return (n<10?"0":"")+n; }
  return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());
}

function acao(a){
  enviarContato();
  if (a === "enviar"){
    var P = PARTES[st.parte-1];
    if (contar(st.respostas[P.n]) < 5) return;
    retomou = false;
    st.parte += 1;
    if (st.parte > 4){ st.tela = "resultado"; st.enviadoEm = agora(); salvar(); render(); }
    else { st.tela = "intervalo"; salvar(); render(); }
  }
  else if (a === "proxima"){ st.tela = "parte"; salvar(); render(); }
  else if (a === "exemplo"){ vendoExemplo = true; render(); }
  else if (a === "sair-exemplo"){ vendoExemplo = false; render(); }
  else if (a === "pdf"){ try { window.print(); } catch(e){} }
  else if (a === "recomecar"){ confirmando = true; render(false); var cf = document.querySelector(".confirm"); if (cf) cf.scrollIntoView({block:"center"}); }
  else if (a === "cancelar"){ confirmando = false; render(false); }
  else if (a === "apagar"){ confirmando = false; apagar(); st = novoEstado(); render(); }
}

/* ===================== CONTATO PARA A MENTOREI (sem respostas) ===================== */
/* Apenas nome, e-mail, WhatsApp e cargo. Respostas e notas nunca saem do aparelho. */
var enviandoAgora = false;
function enviarContato(){
  if (EMBUTIDO || vendoExemplo || !st.perfil || st.envioContato === "ok" || enviandoAgora) return;
  var p = st.perfil;
  enviandoAgora = true;
  fetch(DESTINO, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify({ferramenta:"roda-profissional-futuro", nome:p.nome, email:p.email, whats:p.whats, cargo:p.cargo})})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){ enviandoAgora = false; st.envioContato = (res.ok && res.j && res.j.ok === true) ? "ok" : "erro"; salvar(); })
    .catch(function(){ enviandoAgora = false; st.envioContato = "erro"; salvar(); });
}
window.addEventListener("online", function(){ enviarContato(); });

/* ===================== DENTRO DA PLATAFORMA DE MENTORIAS =====================
   Recebe o cadastro do mentorado e devolve o resultado, que fica guardado na ficha dele (só quando está num quadro da plataforma). */
var tResultado = null;
function agendarResultado(){ clearTimeout(tResultado); tResultado = setTimeout(enviarResultado, 1200); }
function enviarResultado(){
  if (!EMBUTIDO || st.tela !== "resultado") return;
  var c = calcular(st.respostas), p = st.perfil || {}, cm = st.compromisso || {};
  var feitas = [];
  Object.keys(st.checks || {}).forEach(function(k){
    if (!st.checks[k]) return;
    var id = k.slice(0, k.lastIndexOf("-")), n = +k.slice(k.lastIndexOf("-")+1);
    if (PLANOS[id] && PLANOS[id].acoes[n]) feitas.push(PLANOS[id].acoes[n][1]);
  });
  var pacote = {
    data: st.enviadoEm || agora(), nome: p.nome || "", cargo: p.cargo || "",
    media_geral: fmt(c.geral) + " de 10",
    medias_por_parte: PARTES.map(function(P){ return "Parte " + P.n + " · " + P.nome + ": " + fmt(c.porParte[P.n]); }).join("\n"),
    maior_nota: c.best.nome + " (" + fmt(c.best.v) + ")",
    menor_nota: c.worst.nome + " (" + fmt(c.worst.v) + ")",
    primeiro_passo: (cm.passo || "").trim(),
    prazo: cm.ate ? cm.ate.split("-").reverse().join("/") : "",
    acoes_feitas: feitas.join("\n")
  };
  try {
    window.parent.postMessage({tipo:"mentorei-resultado", manual:false, pacote:pacote,
      notas: c.hab.map(function(h){ return {habilidade:h.nome, nota:fmt(h.v)}; })}, location.origin);
  } catch(e){}
}
if (EMBUTIDO){
  window.addEventListener("message", function(e){
    if (e.origin !== location.origin || !e.data || e.data.tipo !== "mentorei-dados") return;
    dadosPlataforma = {nome:e.data.nome || "", email:e.data.email || "", whats:e.data.whatsapp ? mascaraFone(e.data.whatsapp) : "", cargo:e.data.cargo || ""};
    var vazio = ["nome","email","whats","cargo"].every(function(id){ var x = document.getElementById("in-"+id); return !x || !x.value.trim(); });
    if (!st.perfil && !vendoExemplo && vazio) render(false);
  });
  try { window.parent.postMessage({tipo:"mentorei-pronta"}, location.origin); } catch(e){}
}

/* ===================== INÍCIO ===================== */
render();
if (st.perfil && st.envioContato !== "ok") enviarContato();
if (EMBUTIDO && st.tela === "resultado") agendarResultado();
})();
</script>
