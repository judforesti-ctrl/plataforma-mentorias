<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório da mentoria para a empresa · Mentorei</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/simbolo-m.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/relatorio-a4.css">
<style>
  /* Relatório da mentoria para a empresa (script 68): o desenho do relatório da jornada (relatorio-a4.css) + barras e tabelas. */
  .texto p { margin-bottom: 3mm; }
  .lead { font-size: 11.5pt; color: var(--texto); }

  /* em uma página: as quatro perguntas */
  .quadro { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: 5mm; }
  .quadro .bloco { margin: 0; }
  .quadro .bloco p { margin: 0 0 3mm; }
  .bloco .top { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linha); }
  .top li { display: flex; justify-content: space-between; gap: 3mm; padding: 1.6mm 0; border-bottom: 1px solid var(--linha); font-size: 9pt; line-height: 1.35; }
  .top li b { white-space: nowrap; color: var(--petroleo); font-variant-numeric: tabular-nums; }
  .bloco.escuro .top { border-color: rgba(255, 255, 255, .18); }
  .bloco.escuro .top li { border-color: rgba(255, 255, 255, .18); }
  .bloco.escuro .top li b { color: var(--bege); }
  .bloco ol { margin: 0; padding-left: 5mm; }
  .bloco ol li { margin-bottom: 2mm; }
  .bloco ol li:last-child { margin-bottom: 0; }
  .bloco ol li::marker { color: var(--bege-escuro); font-weight: 700; }
  .bloco.escuro ol li::marker { color: var(--bege); }
  .bloco.verde ol li::marker { color: var(--ok); }
  .passos { display: grid; gap: 4mm; margin-top: 5mm; }
  .passos .bloco { margin: 0; }

  /* tabelas */
  .rolar { overflow-x: auto; }
  .tabela-a4 { width: 100%; border-collapse: collapse; font-size: 9.5pt; line-height: 1.45; }
  .tabela-a4 th { text-align: left; font: 700 7.5pt 'Inter', Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--bege-texto); background: var(--bege-claro); padding: 2.2mm 3mm; }
  .tabela-a4 th:last-child { text-align: right; }
  .tabela-a4 td { padding: 2.6mm 3mm; border-bottom: 1px solid var(--linha); vertical-align: top; }
  .tabela-a4 tr { break-inside: avoid; }
  .tabela-a4 td.ind { font-weight: 600; width: 56mm; color: var(--petroleo); }
  .tabela-a4 td.qtd { white-space: nowrap; text-align: right; width: 24mm; }
  .tabela-a4 td.qtd b { font: 800 11pt 'Manrope', Arial, sans-serif; color: var(--petroleo); font-variant-numeric: tabular-nums; }
  .tabela-a4.indicadores th:last-child { text-align: left; }
  .mini { display: block; height: 1.6mm; background: var(--faixa); border-radius: 1mm; margin-top: 1.4mm; }
  .mini i { display: block; height: 100%; background: var(--bege); border-radius: 1mm; }
  .sub-lista { color: var(--apagado); font-size: 8.5pt; }

  /* barras horizontais: dificuldades (líderes) e temas (sessões) */
  .barras { display: grid; gap: 2.6mm; margin: 2mm 0 7mm; }
  .barra-l { display: grid; grid-template-columns: 64mm minmax(0, 1fr) 24mm; gap: 3mm; align-items: center; break-inside: avoid; }
  .barra-nome { font-size: 9pt; font-weight: 600; line-height: 1.3; }
  .barra-trilho { position: relative; height: 5.4mm; background: var(--faixa); border-radius: 1.4mm; overflow: hidden; }
  .barra-trilho i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bege); border-radius: 1.4mm; }
  .barra-l.maior .barra-trilho i { background: var(--petroleo); }
  .barra-val { font: 800 10.5pt 'Manrope', Arial, sans-serif; color: var(--petroleo); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .barra-val small { font: 600 8pt 'Inter', Arial, sans-serif; color: var(--apagado); }

  /* descrição de cada item */
  .itens { list-style: none; margin: 0; padding: 0; }
  .itens li { padding: 2.6mm 0; border-bottom: 1px solid var(--linha); break-inside: avoid; }
  .itens li:first-child { border-top: 1px solid var(--linha); }
  .itens b { color: var(--petroleo); }
  .fim { break-inside: avoid; }   /* o método e a assinatura andam juntos para a página seguinte, se não couberem */
  .fim .assinatura { margin-top: 6mm; }
  .metodo { margin-top: 8mm; font-size: 9pt; color: var(--apagado); border-top: 1.5px solid var(--bege); padding-top: 4mm; break-inside: avoid; }
  .metodo h4 { font-size: 10pt; color: var(--petroleo); margin-bottom: 2mm; }

  @media screen and (max-width: 800px) {
    .quadro { grid-template-columns: 1fr; }
    .barra-l { grid-template-columns: minmax(0, 1fr) 20mm; gap: 1.5mm 3mm; }
    .barra-nome { grid-column: 1 / -1; }
    .tabela-a4 { min-width: 520px; }
  }
</style>
</head>
<body>
<div class="barra"><a id="voltar" href="/app.html#/relatorio-empresa">← Voltar e editar</a>
  <button type="button" id="pdf">Baixar o PDF</button>
  <span>Na janela que abrir, em <b>Destino</b>, escolha <b>Salvar como PDF</b> e clique em <b>Salvar</b>.</span></div>
<div id="doc"><p class="aviso">Carregando o relatório…</p></div>
<script type="module" src="/assets/relatorio-empresa.js"></script>
</body>
</html>
