<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vídeos de boas-vindas · Mentorei</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#091216">
<link rel="icon" href="/assets/simbolo-m.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Vídeos de boas-vindas (script 63): página aberta pelo link do convite, sem login. Um vídeo grande e a lista ao lado. */
  :root { --petroleo: #091216; --petroleo-2: #0E3B44; --bege: #C8AE7C; --bege-escuro: #9C7D4C; --fundo: #F3F5F4; --papel: #fff;
    --linha: #D9DFDD; --texto: #0E171B; --apagado: #5F686D; --f-titulo: 'Manrope', Arial, sans-serif; --f-texto: 'Inter', Arial, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--fundo); color: var(--texto); font-family: var(--f-texto); font-size: 15px; line-height: 1.5; }
  header { background: var(--petroleo); color: #fff; padding: 22px max(16px, env(safe-area-inset-left)) 26px; }
  header .in, main { max-width: 1120px; margin: 0 auto; }
  header img { height: 30px; display: block; margin-bottom: 18px; }
  header small { color: var(--bege); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  h1 { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(26px, 4vw, 36px); margin: 6px 0 6px; line-height: 1.15; }
  header p { margin: 0; color: #cfdcd9; max-width: 62ch; }
  main { padding: 24px max(16px, env(safe-area-inset-left)) 48px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .tela { background: #000; border-radius: 14px; overflow: hidden; }
  video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #000; }
  .info { padding: 14px 4px 0; }
  .info h2 { font-family: var(--f-titulo); margin: 0 0 4px; font-size: 21px; }
  .info p { margin: 0; color: var(--apagado); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li button { width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; background: var(--papel);
    border: 1px solid var(--linha); border-radius: 12px; padding: 12px; cursor: pointer; font: inherit; color: inherit; }
  li button:hover, li button:focus-visible { border-color: var(--bege-escuro); outline: none; }
  li button[aria-current="true"] { border-color: var(--petroleo-2); box-shadow: 0 0 0 2px var(--petroleo-2) inset; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--petroleo-2); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .tit { font-weight: 600; } .tit span { display: block; font-weight: 400; color: var(--apagado); font-size: 13px; }
  .dur { color: var(--apagado); font-size: 13px; font-variant-numeric: tabular-nums; }
  .entrar { margin-top: 16px; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 14px; color: var(--apagado); font-size: 14px; }
  .aviso { grid-column: 1 / -1; background: var(--papel); border-radius: 12px; padding: 18px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="in"><img src="/assets/logo-clara.png" alt="Mentorei"><small id="serie">Boas-vindas</small><h1>Vídeos de boas-vindas</h1>
  <p>Vídeos curtos que mostram, passo a passo, como usar a plataforma de mentorias da Mentorei.</p></div></header>
<main id="m"><p class="aviso">Carregando os vídeos…</p></main>
<script type="module">
import { SERIES, duracaoTexto } from '/assets/tutoriais-regras.js';
const m = document.getElementById('m');
const s = new URLSearchParams(location.search).get('s') || '';
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
try {
  const r = await fetch(`/api/tutoriais?s=${encodeURIComponent(s)}`);
  const j = await r.json();
  if (!r.ok || !(j.videos || []).length) throw new Error('vazio');
  document.getElementById('serie').textContent = SERIES[s] ? SERIES[s].titulo : 'Boas-vindas';
  const vs = j.videos;
  m.innerHTML = `<section><div class="tela"><video id="v" controls playsinline preload="metadata"></video></div>
      <div class="info"><h2 id="vt"></h2><p id="vd"></p></div>
      <div class="entrar">Já criou a sua senha? Entre em <b>plataforma.mentorei.com.br</b>: os vídeos também ficam lá, no menu "Tutoriais".</div></section>
    <ol>${vs.map((v, i) => `<li><button type="button" data-i="${i}"><span class="num">${v.numero}</span><span class="tit">${esc(v.titulo)}${v.descricao ? `<span>${esc(v.descricao)}</span>` : ''}</span><span class="dur">${duracaoTexto(v.duracao_seg)}</span></button></li>`).join('')}</ol>`;
  const v = document.getElementById('v');
  const tocar = (i, auto) => {
    const x = vs[i];
    v.src = x.url; document.getElementById('vt').textContent = `${x.numero} · ${x.titulo}`; document.getElementById('vd').textContent = x.descricao || '';
    m.querySelectorAll('[data-i]').forEach((b) => b.setAttribute('aria-current', String(Number(b.dataset.i) === i)));
    if (auto) v.play().catch(() => {});
    v.onended = () => { if (i + 1 < vs.length) tocar(i + 1, true); };
  };
  m.addEventListener('click', (ev) => { const b = ev.target.closest('[data-i]'); if (b) { tocar(Number(b.dataset.i), true); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
  tocar(0, false);
} catch (_) {
  m.innerHTML = '<p class="aviso">Os vídeos de boas-vindas ainda não estão disponíveis. Se precisar de ajuda, fale com a equipe da Mentorei: contato@mentorei.com.br</p>';
}
</script>
</body>
</html>
