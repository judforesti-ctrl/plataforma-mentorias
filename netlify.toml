# Configuração do Netlify — Plataforma de Mentorias Mentorei
# O site publicado é a pasta "public"; as funções do servidor ficam em "netlify/functions".

[build]
  publish = "public"
  functions = "netlify/functions"

# O Chromium que gera os PDFs dos certificados vai como pacote separado (sem isso o empacotador tenta juntar tudo e quebra).
[functions."certificados-fundo"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"

# Verificação pública dos certificados (endereço impresso no QR code): certificados.mentorei.com.br/CODIGO mostra a página
# verificar.html; a raiz também. Arquivos que existem (imagens do modelo, /api/...) continuam funcionando nesse endereço.
# Na plataforma, a mesma página fica em /verificar/CODIGO.
[[redirects]]
  from = "https://certificados.mentorei.com.br/"
  to = "/verificar.html"
  status = 200
  force = true

[[redirects]]
  from = "https://certificados.mentorei.com.br/*"
  to = "/verificar.html"
  status = 200

[[redirects]]
  from = "/verificar/*"
  to = "/verificar.html"
  status = 200

[[headers]]
  for = "/verificar.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Endereço oficial: plataforma.mentorei.com.br. Os endereços antigos levam para ele.
[[redirects]]
  from = "https://mentorias.mentorei.com.br/*"
  to = "https://plataforma.mentorei.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mentormentorei.netlify.app/*"
  to = "https://plataforma.mentorei.com.br/:splat"
  status = 301
  force = true
